 {n:1, nom:'La catapulte', type:'duel', places:2, min:10, desc:"Volley géant : avec vos catapultes, envoyez la balle dans le camp adverse après un maximum de passes en équipe."},

// =============== Petits outils ===============

const LS = k => 'pxc_'+EVENT+'_'+k;
const lsGet = (k,d)=>{ try{ const v=localStorage.getItem(LS(k)); return v===null?d:JSON.parse(v);}catch(e){return d;} };

const okPhoto = p => (typeof p==='string' && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p)) ? p : '';
function sha256(ascii){
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  var mp=Math.pow, maxWord=mp(2,32), result='', words=[], bitLen=ascii.length*8, i, j;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], pc=k.length, comp={};
  for(var c=2; pc<64; c++){ if(!comp[c]){ for(i=0;i<313;i+=c) comp[i]=c; hash[pc]=(mp(c,.5)*maxWord)|0; k[pc++]=(mp(c,1/3)*maxWord)|0; } }
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); if(j>>8) return ''; words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bitLen/maxWord)|0); words[words.length]=(bitLen);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++){ for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); } }
  return result;
}
const sansAccent = c => String(c==null?'':c).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').toUpperCase();
const empreinte = (quoi, code) => sha256('proxim14|'+quoi+'|'+sansAccent(code));

let local = lsGet('local', { p:{}, e:{}, m:{} });      // copies locales : passages, équipes, messages en cours d'envoi
if(!local.m) local.m={};
let queue = lsGet('queue', {});                   // envois en attente
const kp = (s,t)=>`${s}-${t}`;
const save = ()=>{ lsSet('local',local); lsSet('queue',queue); };

// =============== Base de données (REST Supabase) ===============
const H = { 'apikey':ANON, 'Authorization':'Bearer '+ANON, 'Content-Type':'application/json' };
async function dbGet(table, filtre){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?event=eq.${EVENT}&${filtre}`, {headers:H});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbUpsert(table, conflict, row){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${conflict}`, {method:'POST', headers:{...H,'Prefer':'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(row)});
  if(!r.ok) throw new Error(await r.text());
}
let enFlush=false;
async function flush(){
  if(enFlush) return; enFlush=true;
  for(const k of Object.keys(queue)){
    const q=queue[k];
    try{ await dbUpsert(q.table, q.conflict, q.row); if(queue[k]===q) delete queue[k]; state.dbOk=true; }
    catch(e){ state.err=String(e.message||e); state.dbOk=false; break; }
  }
  enFlush=false; save(); renderDoux();
}
async function refresh(){
  try{
    // Les téléphones des équipes ne reçoivent que « fait ou pas fait » pour leur équipe : ni temps, ni notes, ni bonus.
    const reqP = state.org ? 'select=stand,team,resultat,mesure,b_ambiance,b_cohesion,b_fairplay,updated_at' : `select=stand,team,resultat,updated_at&team=eq.${state.team||0}`;
    const [p,e] = await Promise.all([ dbGet('tb_passages',reqP), dbGet('tb_equipes','select=team,nom,capitaine,updated_at') ]);
    state.passages={}; p.forEach(x=>state.passages[kp(x.stand,x.team)]=x);
    state.equipes={}; e.forEach(x=>state.equipes[x.team]=x);
    state.dbOk=true; state.err='';
    chargerPhoto(state.team);
  }catch(e){ state.dbOk=false; state.err=String(e.message||e); }
  await lireMessages(true);
  renderDoux();
}
async function lireMessages(silencieux){
  try{
    const [r,ct] = await Promise.all([ dbGet('tb_messages','select=cid,team,texte,masque,created_at&order=created_at.desc&limit=120'),
                                       dbGet('tb_messages','select=texte,created_at&team=eq.0&texte=like.__CHAT*&order=created_at.desc&limit=1') ]);
    const avant=state.chatOuvert; state.chatOk=true; state.chatOuvert = !(ct[0] && ct[0].texte==='__CHAT_OFF__');
    if(avant!==state.chatOuvert && state.view==='chat'){ const el=document.getElementById('msgTxt'); const brouillon=el?el.value:''; render(); const el2=document.getElementById('msgTxt'); if(el2) el2.value=brouillon; }
    const vus = new Set(r.map(x=>x.cid)); Object.keys(local.m).forEach(c=>{ if(vus.has(c)) delete local.m[c]; });
    state.messages = r.filter(x=>!/^__CHAT_/.test(x.texte)).reverse();
  }catch(e){ state.chatOk=false; }
  if(!silencieux){ if(state.view==='chat' || (state.view==='org' && state.orgTab==='messages')) majFil(); majBas(); }
}
async function chargerPhoto(t){
  if(!t || state.photos[t] || !equipe(t)) return;
  const loc = okPhoto(lsGet('photo_'+t,'')); if(loc){ state.photos[t]=loc; return; }
  try{ const r = await dbGet('tb_equipes',`team=eq.${t}&select=photo`); if(r[0] && okPhoto(r[0].photo)){ state.photos[t]=r[0].photo; renderDoux(); } }catch(e){}
}
function pousser(table, conflict, key, row){ queue[key]={table,conflict,row}; save(); flush(); }

// =============== Données fusionnées et calcul des points ===============
function passages(){
  const all={...state.passages};
  Object.entries(local.p).forEach(([k,r])=>{ if(!all[k] || (all[k].updated_at||'') <= r.updated_at) all[k]=r; });
  return all;
}
function equipe(t){
  const a=state.equipes[t], b=local.e[t];
  if(a && b) return (a.updated_at||'') <= b.updated_at ? b : a;
  return b || a || null;
}
function calcul(){
  const rows = Object.values(passages()).filter(r=>r.resultat && r.resultat!=='X');
  const pts={}, rang={};
  EP.forEach(e=>{
    const list = rows.filter(r=>r.stand===e.n);
    if(e.type==='duel') list.forEach(r=>{ pts[kp(e.n,r.team)] = r.resultat==='V'?10 : r.resultat==='N'?6 : 3; });
    else if(e.type==='jury') list.forEach(r=>{ pts[kp(e.n,r.team)] = Math.max(0,Math.min(10,Math.round(+r.mesure||0))); });
    else if(e.type==='quiz') list.forEach(r=>{ pts[kp(e.n,r.team)] = 2*Math.max(0,Math.min(10,Math.round(+r.mesure||0))); });
    else { const v=list.filter(r=>r.mesure!=null), n=v.length, asc=e.type==='chrono';
      v.forEach(r=>{ const mieux=v.filter(x=> asc ? +x.mesure<+r.mesure : +x.mesure>+r.mesure).length; pts[kp(e.n,r.team)] = 10-2*Math.floor(5*mieux/n); rang[kp(e.n,r.team)]={r:mieux+1,n}; }); }
  });
  const eq={};
  for(let t=1;t<=N_EQUIPES;t++) eq[t]={t,faits:0,base:0,bonus:0,total:0,quiz:null};
  rows.forEach(r=>{ const e=eq[r.team]; if(!e) return; const p=pts[kp(r.stand,r.team)]; if(p==null) return;
    const b=(r.b_ambiance?1:0)+(r.b_cohesion?1:0)+(r.b_fairplay?1:0);
    e.faits++; e.base+=p; e.bonus+=b; e.total+=p+b; if(r.stand===12) e.quiz=Math.max(0,Math.min(10,Math.round(+r.mesure||0))); });
  const ordre = Object.values(eq).sort((a,b)=> b.total-a.total || b.faits-a.faits || (b.quiz||0)-(a.quiz||0) || a.t-b.t).map(e=>e.t);
  const general = eq[ordre[0]].total>0 ? ordre[0] : null;
  const qz = Object.values(eq).filter(e=>e.quiz!=null && e.t!==general).sort((a,b)=> b.quiz-a.quiz || b.total-a.total || a.t-b.t);
  const amb = Object.values(eq).filter(e=>e.bonus>0).sort((a,b)=> b.bonus-a.bonus || b.total-a.total || a.t-b.t);
  return { pts, rang, eq, ordre, general, prixQuiz: qz.length?qz[0].t:null, ambiance: amb.length?amb[0].t:null, saisies: rows.length };
}
function temps(){
  const d=new Date(); const jourJ = ESSAI || (d.getFullYear()===2026 && d.getMonth()===10 && d.getDate()===14);
  if(!jourJ) return { etat:'avant', txt:'Samedi 14 novembre · épreuves de 10h15 à 12h30', court:'à 12h30', ecoule:0 };
  if(d < DEBUT_EPREUVES){ const m=Math.ceil((DEBUT_EPREUVES-d)/60000); return { etat:'avant', txt: m>90 ? 'Épreuves de 10h15 à 12h30' : `Début des épreuves dans ${m} min`, court:'à 12h30', ecoule:0 }; }
  if(d >= FIN_EPREUVES) return { etat:'fini', txt:'C\'est terminé : rendez-vous au podium !', court:'terminé', ecoule:999 };
  const s=Math.floor((FIN_EPREUVES-d)/1000), h=Math.floor(s/3600), m=Math.floor((s%3600)/60), ss=s%60;
  const hms = (h?h+' h ':'')+String(m).padStart(h?2:1,'0')+' min '+String(ss).padStart(2,'0')+' s';
  return { etat: s<600?'urgent':'encours', txt:'Il reste '+hms, court: (h?h+' h ':'')+String(m).padStart(2,'0')+' min', ecoule: Math.floor((d-DEBUT_EPREUVES)/60000) };
}
function resteTxt(){ const t=temps(); return t.etat==='encours'||t.etat==='urgent' ? 'Fin des épreuves dans '+t.court : (t.etat==='fini' ? 'Épreuves terminées' : 'Fin des épreuves à 12h30'); }
function majRebours(){ const el=document.getElementById('rebours'); if(!el) return; const t=temps(); el.textContent=t.txt; el.className='rebours'+(t.etat==='urgent'?' urgent':'')+(t.etat==='fini'?' fini':''); }
const nomEq = t => { const e=equipe(t); return e && e.nom ? e.nom : ''; };
const titreEq = t => `Équipe ${t}` + (nomEq(t) ? ' · '+esc(nomEq(t)) : '');

// =============== Rendu ===============
function vueParDefaut(){
  if(state.org && !state.team) return 'org';
  const inscrite = state.team && equipe(state.team) && equipe(state.team).nom;
  if(state.orgRetour) return inscrite ? 'home' : 'brief';
  if(confirmee() && inscrite) return lsGet('regles_vues',false) ? 'home' : 'regles';
  return lsGet('accueil_vu',false) ? 'brief' : 'accueil';
}
function renderDoux(){
  const a=document.activeElement;
  if(a && (a.tagName==='INPUT'||a.tagName==='SELECT')) return;          // on ne touche pas à un écran en cours de saisie
  if(['saisie','bravo','landing','regles'].includes(state.view)) return;
  if(state.view==='accueil'){ if(confirmee() && equipe(state.team) && equipe(state.team).nom){ state.view=''; render(); } return; }
  if(state.view==='chat' || (state.view==='org' && state.orgTab==='messages')){ majFil(); majBas(); return; }
  if(state.view==='brief'){                                              // un autre téléphone de l'équipe a déjà inscrit l'équipe
    if(!state.edition && (confirmee()||state.orgRetour) && equipe(state.team) && equipe(state.team).nom){ state.view=''; render(); }
    else if(!state.team || (!state.edition && !confirmee())) majChoix();          // la liste des équipes déjà inscrites se met à jour
    return;
  }
  render();
}
function render(){
  if(!state.view) state.view = vueParDefaut();
  if(state.view==='home' && !(state.team && equipe(state.team) && equipe(state.team).nom)) state.view='brief';
  let h='';
  if(ESSAI) h += `<div class="banner"><b>MODE ESSAI.</b> Rien de ce qui est saisi ici ne compte pour la journée. <button class="lnk" style="padding:0" onclick="recommencerEssai()">Recommencer l'essai à zéro sur ce téléphone</button></div>`;
  if(state.dbOk===false) h += `<div class="banner err"><b>Pas de connexion pour l'instant.</b> Vos résultats sont gardés sur ce téléphone et seront envoyés dès que possible. Continuez à jouer.</div>`;
  const nq=Object.keys(queue).length; if(nq && state.dbOk!==false) h += `<div class="banner">Envoi en cours (${nq})…</div>`;
  h += ({accueil:vAccueil, regles:vRegles, landing:vLanding, brief:vBrief, home:vHome, ep:vEpreuve, saisie:vSaisie, bravo:vBravo, org:vOrg, chat:vChat}[state.view]||vLanding)();
  $('#main').innerHTML = h;
  majBas(); majRebours();
  if(state.view==='chat' || (state.view==='org' && state.orgTab==='messages')) majFil(true);
}
function vLanding(){
  return `<div class="card"><h2>Espace organisation</h2><p class="muted">Réservé à l'équipe Pull Up.</p></div>${blocOrg()}<button class="lnk" onclick="state.view='';render()">← Retour</button>`;
}

  return state.org ? `<button class="btn marine" onclick="aller('org')">Espace organisation</button>`
   : `<div class="card"><p class="muted">Organisation Pull Up</p><input type="password" id="codeOrg" autocomplete="off" autocapitalize="none" placeholder="Code organisation"><button class="btn clair" onclick="entrerOrg()">Entrer</button></div>`;
}
function optionsNumeros(){

}
function majChoix(){ const el=document.getElementById('selNum'); if(el && document.activeElement!==el){ const v=el.value; el.innerHTML=optionsNumeros(); el.value=v; }
  const t=state.team; if(t && !state.edition && nomEq(t) && !document.getElementById('dejaInscrite')){ garderBrouillon(); render(); } }

      <li><span class="num" style="background:var(--bleu)">1</span><div><b>Faites un maximum d'épreuves</b> pour gagner un maximum de points. Il y en a 14, dans l'ordre que vous voulez.</div></li>

    </ul>`;

      <button class="btn clair" onclick="garderBrouillon();document.getElementById('fPhoto').click()">${p?'Reprendre la photo':'Prendre la photo de l\'équipe'}</button>
      <button class="btn orange" onclick="inscrire()">OK</button>
      ${p?'':'<button class="lnk" onclick="inscrire(true)">Continuer sans photo</button>'}`;
  h += `</div>`;
  if(state.orgRetour) h += `<button class="btn marine" onclick="aller('org')">Retour à l'organisation</button>`;
  return h;

const fait = (n,t) => { const r=passages()[kp(n,t)]; return !!(r && r.resultat && r.resultat!=='X'); };

function vSaisie(){
  const e=EPN[state.ep], s=state.saisie, t=state.team;
  let champ='';
  if(e.type==='duel') champ = `<label>Résultat de l'équipe ${t}</label><div class="choix"><button class="${s.res==='V'?'sel':''}" onclick="setRes('V')">Victoire</button><button class="${s.res==='N'?'sel':''}" onclick="setRes('N')">Égalité</button><button class="${s.res==='D'?'sel':''}" onclick="setRes('D')">Défaite</button></div>`;
  else if(e.type==='chrono') champ = `<div class="row"><div><label>Minutes</label><input type="number" id="mm" inputmode="numeric" min="0" max="59" placeholder="min"></div><div><label>Secondes</label><input type="number" id="ss" inputmode="numeric" min="0" max="59" placeholder="s"></div></div>`;
  else champ = `<label>${{points:'Total de points de l\'équipe', jury:'Note du jury (de 0 à 10)', quiz:'Bonnes réponses (de 0 à 10)', hauteur:'Hauteur de la tour (en cm)'}[e.type]}</label><input type="number" id="mv" inputmode="numeric" min="0" ${(e.type==='jury'||e.type==='quiz')?'max="10"':''}>`;
  const bb = (k,l)=>`<button class="${s.bonus[k]?'sel':''}" onclick="setBonus('${k}')">${l}<br><small>+1</small></button>`;
  return `<div class="anim"><h2>Espace animateur</h2><p class="muted">Épreuve ${e.n} · ${e.nom}<br>${titreEq(t)} (tissu ${couleur(t).toLowerCase()})</p>
    ${champ}
    <label>Bonus (facultatif)</label><div class="choix">${bb('a','Ambiance')}${bb('c','Cohésion')}${bb('f','Fair-play')}</div>
    ${state.org?'<p class="muted" style="margin-top:12px">Mode organisation : pas de code à saisir.</p>':`<label>Code de l'animateur</label><input type="password" id="codeA" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Code animateur">`}
    <button class="btn orange" onclick="validerSaisie()">Valider le résultat</button>
    <button class="btn clair" style="background:transparent;color:#fff" onclick="aller('ep')">Annuler</button>
    ${passages()[kp(e.n,t)] && passages()[kp(e.n,t)].resultat!=='X' ? '<button class="lnk" style="color:#C9DCEC" onclick="supprimerPassage()">Effacer ce passage</button>':''}
  </div>`;
}
function vBravo(){
  const b=state.bravo||{};
  return `<div class="bravo"><div class="p" style="font-size:46px">✓</div><p style="margin:10px 0 0;font-size:19px"><b>${esc(b.titre||'C\'est validé !')}</b></p><p style="margin:8px 0 0">${b.sous||''}</p></div>
    <button class="btn" onclick="aller('home')">Épreuve suivante</button>`;
}
// ---------- Messagerie ----------
function annonce(){ const vue=lsGet('annonce_vue',''); const l=state.messages.filter(m=>m.team===0 && !m.masque); const d=l[l.length-1]; return d && d.cid!==vue ? d : null; }
function tousMessages(){ const enCours=Object.values(local.m); return state.messages.concat(enCours.filter(x=>!state.messages.some(m=>m.cid===x.cid))); }
function nonLus(){ const lu=lsGet('lu',''); const moi = state.org&&!state.orgRetour ? 0 : state.team; return state.messages.filter(m=>!m.masque && m.team!==moi && (m.created_at||'')>lu).length; }
function htmlFil(){
  const moi = state.org ? 0 : state.team; const l=tousMessages().filter(m=>state.org || !m.masque);
  if(!l.length) return '<p class="muted" style="text-align:center;padding:20px 0">Aucun message pour l\'instant. Lancez la conversation !</p>';
  return l.map(m=>{ const h=m.created_at?new Date(m.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';
    const qui = m.team===0 ? 'Organisation' : `Équipe ${m.team}`+(nomEq(m.team)?' · '+esc(nomEq(m.team)):'');
    return `<div class="msg ${m.team===0?'org':''} ${m.team===moi&&m.team!==0?'moi':''} ${m.masque?'masque':''}"><div class="q">${qui}<span class="h">${h}${local.m[m.cid]?' · envoi…':''}</span></div>${esc(m.texte)}${state.org&&!m.masque&&!local.m[m.cid]?`<br><button class="lnk" style="color:${m.team===0?'#C9DCEC':'var(--gris)'}" onclick="masquer('${m.cid}')">Masquer ce message</button>`:''}</div>`; }).join('');
}
function majFil(bas){ const el=document.getElementById('fil'); if(!el) return; const pres = (window.innerHeight+window.scrollY) >= document.body.scrollHeight-140; el.innerHTML=htmlFil();
  const d=state.messages[state.messages.length-1]; if(d) lsSet('lu', d.created_at||''); if(bas||pres) window.scrollTo(0,document.body.scrollHeight); }
function zoneEcrire(){
  if(state.chatOk===false) return '<div class="banner">La messagerie n\'est pas encore disponible.</div>';
  if(!state.chatOuvert && !state.org) return '<div class="banner">La messagerie est fermée pour le moment. Vous pouvez toujours lire les messages de l\'organisation.</div>';
  return `<div class="ecrire"><input type="text" id="msgTxt" maxlength="200" placeholder="${state.org?'Message à toutes les équipes':'Votre message'}" onkeydown="if(event.key==='Enter')envoyerMessage()"><button class="btn" onclick="envoyerMessage()">Envoyer</button></div>`;
}
function vChat(){
  return `<div class="card" style="padding:12px 14px"><b>Messagerie de la journée</b><p class="muted" style="margin:4px 0 0">Toutes les équipes et l'organisation voient ces messages. Une question ? Écrivez-la ici, l'organisation vous répond. Restez bon enfant.</p></div>
    <div class="fil" id="fil"></div>${zoneEcrire()}`;
}
function majBas(){
  const bas=document.getElementById('bas'); if(!bas) return;
  const equipeInscrite = state.team && equipe(state.team) && equipe(state.team).nom && !state.orgRetour;
  const montrer = equipeInscrite && ['home','ep','chat'].includes(state.view);
  bas.style.display = montrer ? 'flex' : 'none'; document.body.classList.toggle('avecBas', !!montrer);
  if(!montrer) return; const n = state.view==='chat' ? 0 : nonLus();
  bas.innerHTML = `<button class="${state.view!=='chat'?'on':''}" onclick="aller('home')">Épreuves</button><button class="${state.view==='chat'?'on':''}" onclick="aller('chat')">Messages${n?`<span class="pastille">${n}</span>`:''}</button>`;
}
function phStyle(t){ const p=state.photos[t]; return p?`background-image:url('${p}')`:''; }
function vOrg(){
  const c=calcul(); const inscrites=Array.from({length:N_EQUIPES},(_,i)=>i+1).filter(t=>nomEq(t)).length;
  let h = `<nav class="tabs">${[['classement','Classement'],['epreuves','Épreuves'],['equipes','Équipes'],['messages','Messages'+(state.orgTab!=='messages'&&nonLus()?' ('+nonLus()+')':'')]].map(([k,l])=>`<button class="${state.orgTab===k?'on':''}" onclick="orgTab('${k}')">${l}</button>`).join('')}</nav>`;
  if(state.orgTab==='classement'){
    h += `<div class="card"><div class="scores" style="margin-top:0"><div><b>${c.saisies}</b><span>résultats saisis</span></div><div><b>${inscrites}/${N_EQUIPES}</b><span>équipes inscrites</span></div><div><b style="font-size:15px;padding-top:6px">${temps().court}</b><span>fin des épreuves</span></div></div><button class="btn clair" onclick="refresh()">Actualiser</button></div>`;
    if(c.general){ [c.general,c.prixQuiz,c.ambiance].forEach(t=>t&&chargerPhoto(t));
      h += `<div class="prix" style="background:linear-gradient(160deg,var(--bleu),var(--marine))"><div class="ph" style="${phStyle(c.general)}"></div><div><div class="t">Grand prix de la cohésion</div><div class="n">${titreEq(c.general)}</div><div>${c.eq[c.general].total} points · ${pl(c.eq[c.general].faits,'épreuve')}</div></div></div>`;
      h += c.prixQuiz ? `<div class="prix" style="background:var(--orange)"><div class="ph" style="${phStyle(c.prixQuiz)}"></div><div><div class="t">Prix spécial Proxim'Services (culture d'entreprise)</div><div class="n">${titreEq(c.prixQuiz)}</div><div>${c.eq[c.prixQuiz].quiz} bonnes réponses sur 10</div></div></div>` : `<div class="banner">Prix spécial : en attente des résultats de la culture d'entreprise.</div>`;
      if(c.ambiance) h += `<div class="prix" style="background:var(--vert)"><div class="ph" style="${phStyle(c.ambiance)}"></div><div><div class="t">Coup de cœur des animateurs (bonus)</div><div class="n">${titreEq(c.ambiance)}</div><div>${pl(c.eq[c.ambiance].bonus,'point')} d'ambiance, de cohésion et de fair-play</div></div></div>`;
    }
    h += `<div class="card" style="padding:8px"><table><tr><th>#</th><th style="text-align:left">Équipe</th><th>Pts</th><th>Épr.</th><th>Culture</th><th>Bonus</th></tr>`;
    c.ordre.forEach((t,i)=>{ const e=c.eq[t]; h += `<tr class="${e.total>0&&i<3?'top'+(i+1):''}" onclick="voirEquipe(${t})"><td>${i+1}</td><td class="l"><b>${t}</b> ${esc(nomEq(t))||'<span class="muted">non inscrite</span>'}</td><td><b>${e.total}</b></td><td>${e.faits}</td><td>${e.quiz==null?'·':e.quiz}</td><td>${e.bonus}</td></tr>`; });
    h += `</table><p class="muted" style="padding:8px 6px 0">Touchez une équipe pour ouvrir son carnet (saisie de secours ou correction). Égalité : nombre d'épreuves, puis culture d'entreprise. Le prix spécial ne va jamais à l'équipe du grand prix.</p></div>`;
  } else if(state.orgTab==='epreuves'){
    const all=Object.values(passages()).filter(r=>r.resultat&&r.resultat!=='X');
    h += EP.map(e=>{ const l=all.filter(r=>r.stand===e.n); const reste=Array.from({length:N_EQUIPES},(_,i)=>i+1).filter(t=>!l.some(r=>r.team===t));
      return `<div class="card"><b>${e.n}. ${e.nom}</b> <span class="muted">· ${pl(l.length,'équipe')} passée${l.length>1?'s':''} sur ${N_EQUIPES}</span><div class="prog"><div style="width:${100*l.length/N_EQUIPES}%"></div></div><p class="muted" style="margin:8px 0 0">Pas encore passées : ${reste.length?reste.join(', '):'aucune'}</p></div>`; }).join('');
  } else if(state.orgTab==='messages'){
    h += `<div class="card" style="padding:12px 14px"><b>Messagerie</b><p class="muted" style="margin:4px 0 8px">Vos messages partent à toutes les équipes et s'affichent en haut de leur écran. Vous pouvez masquer un message déplacé.</p>
      <button class="btn clair" style="margin-top:0" onclick="basculerChat()">${state.chatOuvert?'Fermer la messagerie aux équipes':'Rouvrir la messagerie aux équipes'}</button></div><div class="fil" id="fil"></div>${zoneEcrire()}`;
  } else {
    h += `<div class="card"><p class="muted">Les ${N_EQUIPES} équipes. Touchez une équipe pour ouvrir son carnet.</p>${state.galerie?'':'<button class="btn clair" onclick="chargerGalerie()">Afficher les photos des équipes</button>'}</div><div class="gal">`;
    for(let t=1;t<=N_EQUIPES;t++){ const e=equipe(t); h += `<div onclick="voirEquipe(${t})">${state.galerie&&state.photos[t]?`<img src="${state.photos[t]}" alt="">`:''}<b>Équipe ${t}</b> · ${couleur(t)}<br>${e&&e.nom?esc(e.nom)+'<br><span class="muted">'+esc(e.capitaine||'')+'</span>':'<span class="muted">non inscrite</span>'}</div>`; }
    h += `</div>`;
  }
  return h + `<button class="lnk" onclick="quitterOrg()">Quitter l'espace organisation</button>`;
}

// =============== Actions ===============
function aller(v){ state.view=v; if(v==='org'){ state.orgRetour=false; } render(); if(v!=='chat') window.scrollTo(0,0); if(v==='org'||v==='home') refresh(); if(v==='chat') lireMessages(); }
window.aller=aller;
window.choisirNumero = v=>{ garderBrouillon(); const anc=state.team, t=(+v>=1&&+v<=N_EQUIPES)?+v:0;
  if(anc && t && t!==anc){ const loc=okPhoto(lsGet('photo_'+anc,'')); if(loc){ lsSet('photo_'+t,loc); state.photos[t]=loc; } lsSet('photo_'+anc,''); delete state.photos[anc]; }   // la photo déjà prise suit le nouveau numéro
  state.team=t; render(); if(t) refresh(); };
window.recommencerEssai = ()=>{ if(!ESSAI || !confirm('Effacer l\'essai en cours sur ce téléphone ?')) return; Object.keys(localStorage).filter(k=>k.indexOf('pxc_'+EVENT+'_')===0).forEach(k=>localStorage.removeItem(k)); location.href = location.pathname + '?essai'; };
window.debuter = ()=>{ lsSet('accueil_vu',true); state.view='brief'; render(); window.scrollTo(0,0); };
window.reglesVues = ()=>{ lsSet('regles_vues',true); state.view='home'; render(); window.scrollTo(0,0); refresh(); };
window.rejoindre = ()=>{ if(!state.team) return; const eq=equipe(state.team); if(eq){ local.e[state.team]={team:state.team,nom:eq.nom,capitaine:eq.capitaine,updated_at:eq.updated_at||''}; save(); } lsSet('team',state.team); lsSet('brouillon_nom',''); lsSet('brouillon_cap',''); state.view = state.orgRetour ? 'home' : 'regles'; render(); window.scrollTo(0,0); refresh(); };
window.changerEquipe = ()=>{ if(!confirm('Changer d\'équipe sur ce téléphone ?')) return; lsSet('team',0); lsSet('regles_vues',false); state.team=0; state.edition=false; state.view='brief'; render(); window.scrollTo(0,0); };
window.entrerOrg = ()=>{ if(codeOrgOk($('#codeOrg').value)){ state.org=true; lsSet('org',true); aller('org'); } else alert('Code incorrect.'); };
window.quitterOrg = ()=>{ state.org=false; lsSet('org',false); state.orgRetour=false; state.view=''; render(); };
window.orgTab = k=>{ state.orgTab=k; render(); if(k==='messages') lireMessages(); };
let dernierEnvoi=0;
function posterMessage(texte){
  const team = state.org ? 0 : state.team; const cid = (Date.now().toString(36)+Math.random().toString(36).slice(2,10));
  const row = { event:EVENT, cid, team, texte, code:CLE };
  if(!/^__CHAT_/.test(texte)) local.m[cid] = { ...row, masque:false, created_at:new Date().toISOString() };
  pousser('tb_messages','cid','m-'+cid,row);
}
window.envoyerMessage = ()=>{
  const el=document.getElementById('msgTxt'); if(!el) return; const txt=(el.value||'').trim().slice(0,200); if(!txt) return;
  if(!state.org && !state.chatOuvert){ alert('La messagerie est fermée pour le moment.'); render(); return; }
  if(!state.org && Date.now()-dernierEnvoi < 4000){ alert('Un instant : un message toutes les 4 secondes.'); return; }
  dernierEnvoi=Date.now(); posterMessage(txt); el.value=''; majFil(true); setTimeout(()=>lireMessages(), 1500);
};
window.masquer = cid=>{ const m=state.messages.find(x=>x.cid===cid); if(!m || !confirm('Masquer ce message pour toutes les équipes ?')) return;
  m.masque=true; pousser('tb_messages','cid','m-'+cid,{ event:EVENT, cid, team:m.team, texte:m.texte, masque:true, code:CLE }); majFil(); };
window.basculerChat = ()=>{ if(!confirm(state.chatOuvert?'Fermer la messagerie ? Les équipes ne pourront plus écrire.':'Rouvrir la messagerie aux équipes ?')) return;
  posterMessage(state.chatOuvert?'__CHAT_OFF__':'__CHAT_ON__'); state.chatOuvert=!state.chatOuvert; render(); };
window.annonceVue = cid=>{ lsSet('annonce_vue',cid); render(); };
window.voirEquipe = t=>{ state.team=t; state.orgRetour=true; state.view=''; render(); window.scrollTo(0,0); chargerPhoto(t); };
window.chargerGalerie = async ()=>{ try{ const r=await dbGet('tb_equipes','select=team,photo'); r.forEach(x=>{ if(okPhoto(x.photo)) state.photos[x.team]=x.photo; }); }catch(e){} state.galerie=true; render(); };
window.garderBrouillon = ()=>{ if($('#fNom')) lsSet('brouillon_nom',$('#fNom').value); if($('#fCap')) lsSet('brouillon_cap',$('#fCap').value); };
window.photoChoisie = inp=>{
  const f=inp.files && inp.files[0]; if(!f) return;
  const url=URL.createObjectURL(f); const im=new Image();
  im.onload=()=>{ const max=800, k=Math.min(1,max/Math.max(im.width,im.height)); const cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); const data=cv.toDataURL('image/jpeg',0.7); URL.revokeObjectURL(url);
    state.photos[state.team]=data; lsSet('photo_'+state.team,data); render(); };
  im.onerror=()=>alert('Photo illisible, réessayez.'); im.src=url;
};
window.inscrire = async sansPhoto=>{
  const t=state.team; if(!t){ alert('Choisissez le numéro de votre équipe.'); return; }
  const nom=($('#fNom').value||'').trim(), cap=($('#fCap').value||'').trim(); const photo=state.photos[t]||okPhoto(lsGet('photo_'+t,''));
  if(!nom){ alert('Donnez un nom à votre équipe.'); return; }
  if(!cap){ alert('Indiquez le prénom du capitaine.'); return; }
  if(!photo && !sansPhoto){ alert('Prenez la photo de toute l\'équipe (ou touchez « Continuer sans photo »).'); return; }
  if(!state.edition){            // un autre téléphone vient peut-être d'inscrire ce numéro : on vérifie avant d'écraser
    garderBrouillon();
    try{ const r=await dbGet('tb_equipes',`team=eq.${t}&select=team,nom,capitaine,updated_at`); if(r[0] && r[0].nom){ state.equipes[t]=r[0]; render(); alert(`L'équipe ${t} vient d'être inscrite sous le nom « ${r[0].nom} ». Si c'est bien votre équipe, touchez « Oui, c'est mon équipe ».`); return; } }catch(e){}
  }
  const row={ event:EVENT, team:t, nom, capitaine:cap, code:CLE, updated_at:new Date().toISOString() };
  local.e[t]={team:t,nom,capitaine:cap,updated_at:row.updated_at};
  pousser('tb_equipes','event,team','e-'+t, photo ? {...row, photo} : row);
  lsSet('team',t); lsSet('brouillon_nom',''); lsSet('brouillon_cap','');
  const modif=state.edition; state.edition=false; state.view = (modif || state.orgRetour) ? 'home' : 'regles'; render(); window.scrollTo(0,0);
};
window.modifierEquipe = ()=>{
  if(!state.org){ const c=prompt('Code de l\'animateur ou de l\'organisation :'); if(c===null) return; if(!codeStandOk(0,c)){ alert('Code incorrect.'); return; } }
  const e=equipe(state.team)||{}; lsSet('brouillon_nom',e.nom||''); lsSet('brouillon_cap',e.capitaine||''); state.edition=true; state.view='brief'; render(); window.scrollTo(0,0);
};
window.ouvrir = n=>{ state.ep=n; state.view='ep'; render(); window.scrollTo(0,0); };
window.demarrerSaisie = ()=>{ const r=passages()[kp(state.ep,state.team)]; const ok=state.org&&r&&r.resultat&&r.resultat!=='X';
  state.saisie={ res: ok&&EPN[state.ep].type==='duel'?r.resultat:'', bonus:{a:!!(ok&&r.b_ambiance), c:!!(ok&&r.b_cohesion), f:!!(ok&&r.b_fairplay)} }; state.view='saisie'; render(); window.scrollTo(0,0); };
function garderChamps(){ const v={}; ['mm','ss','mv','codeA'].forEach(id=>{ const el=document.getElementById(id); if(el) v[id]=el.value; }); return v; }
function remettreChamps(v){ Object.entries(v).forEach(([id,val])=>{ const el=document.getElementById(id); if(el) el.value=val; }); }
window.setRes = r=>{ const v=garderChamps(); state.saisie.res=r; render(); remettreChamps(v); };
window.setBonus = k=>{ const v=garderChamps(); state.saisie.bonus[k]=!state.saisie.bonus[k]; render(); remettreChamps(v); };
function codeSaisieOk(){ if(state.org) return true; const c=$('#codeA')?$('#codeA').value:''; if(!codeStandOk(state.ep,c)){ alert('Code de l\'animateur incorrect.'); return false; } return true; }
window.validerSaisie = ()=>{
  const e=EPN[state.ep], t=state.team, s=state.saisie; let res='F', mes=null;
  if(e.type==='duel'){ if(!s.res){ alert('Choisissez Victoire, Égalité ou Défaite.'); return; } res=s.res; }
  else if(e.type==='chrono'){ const mm=+($('#mm').value||0), ss=+($('#ss').value||0); if(mm<0||ss<0||ss>59||(mm===0&&ss===0)){ alert('Saisissez le temps en minutes et secondes.'); return; } mes=mm*60+ss; }
  else { const v=$('#mv').value; if(v===''||isNaN(+v)||+v<0){ alert('Saisissez le résultat.'); return; } if((e.type==='jury'||e.type==='quiz') && +v>10){ alert('La valeur doit être comprise entre 0 et 10.'); return; } mes=+v; }
  if(!codeSaisieOk()) return;
  const row={ event:EVENT, stand:e.n, team:t, resultat:res, mesure:mes, b_ambiance:s.bonus.a, b_cohesion:s.bonus.c, b_fairplay:s.bonus.f, code:CLE, updated_at:new Date().toISOString() };
  local.p[kp(e.n,t)]=row; pousser('tb_passages','event,stand,team','p-'+kp(e.n,t),row);
  state.bravo={ titre:`${e.nom} : c'est validé !`, sous:`Résultat enregistré pour l'équipe ${t}. Les points restent secrets jusqu'au podium.` };
  state.view='bravo'; render(); window.scrollTo(0,0);
};
window.supprimerPassage = ()=>{
  if(!confirm('Effacer le résultat de cette épreuve pour cette équipe ?')) return; if(!codeSaisieOk()) return;
  const e=EPN[state.ep], t=state.team; const row={ event:EVENT, stand:e.n, team:t, resultat:'X', mesure:null, b_ambiance:false, b_cohesion:false, b_fairplay:false, code:CLE, updated_at:new Date().toISOString() };
  local.p[kp(e.n,t)]=row; pousser('tb_passages','event,stand,team','p-'+kp(e.n,t),row); aller('ep');
};
window.refresh=refresh;
window.addEventListener('online', flush);
setInterval(()=>{ flush(); refresh(); }, 20000);
setInterval(()=>{ if(state.view==='chat' || (state.view==='org' && state.orgTab==='messages')) lireMessages(); }, 6000);
setInterval(majRebours, 1000);
setInterval(()=>{ if(state.view==='home') renderDoux(); }, 60000);          // pour faire clignoter la culture d'entreprise le moment venu
if(Q.has('org')){ if(!tQ) state.team=0; state.view = state.org ? 'org' : 'landing'; }
else if(!confirmee() && !(tQ>=1)) state.team=0;
render(); refresh();
</script>
</body>
</html>
