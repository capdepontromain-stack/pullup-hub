// Codes des animateurs : seules les empreintes sont ici, les codes sont sur les fiches de stand.
const EMPREINTES = /*EMPREINTES*/{org:'0ddbd35979dd4e5d58fefed283f9bf31d7e0350ff8854ec882c4153e6a9a2da5',stands:{1:'7f361d572d73b52e260d9ca28a88613afe1b3a1796f83da46472c9d83702baa6',2:'34f43c80ac9cc325977c4c369add92d43a992aaf79654411171729dc3f179ec5',3:'20e34eeb3de6e08600967e68009d3b5526cdb4b7af855d7227d9e76c2966d6b3',4:'fe23da6610764d061954dd135aba91dbdaad427e75b8841a7cec663ecfd4be32',5:'9c03cf49addff639cd5efad94318681eb9fc571780d8eb45494d04d6657f9928',6:'99fef52cb8f88d366d4a67d3fd48af0968084ef447d79ce402e1f7cdb9117270',7:'75e913a2b157bb154081a5eb67261933adfd99c11e03e03504cb264ea699b16e',8:'c871d48e5bd655f636aa2b1b9fa58d462860b18d448984cc10fb6594201b7513',9:'1975d3c9e28221088efd6da5dfe219d19a2b4dbbbb8f86b27bd974ab84cc518f',10:'e26569602ca8c8f407edcabffb7fc83c8cef7c8402b296cdfc2fe638fe9b2788',11:'799aee50d57c82df129d2549c78f04cc0b1a83b8ed4e287ab6026f05b9bbd3a3',12:'b43757417bcf0061fa53785caacb975daf63e8d218a66927c9be658538d89ab1',13:'0dc670a4d3b13210421ae0aab768c0cd26f3a1ffd74e9f8307a4b6b8e60bb672',14:'7f928a14cd22055445bdc5620b05ef19d6bf9824c64e5619da520a1d9b774f39'}};
// type : duel / chrono (secondes) / points / jury (note sur 10) / quiz (bonnes réponses sur 10) / hauteur (cm)

 {n:1, nom:'La catapulte', type:'duel', places:2, min:10, desc:"Volley géant : avec vos catapultes, envoyez la balle dans le camp adverse après un maximum de passes en équipe."},

 {n:11, nom:'Le théâtre', type:'jury', places:3, min:10, desc:"Un thème imposé, 5 minutes pour préparer, 2 minutes pour jouer. Le jury note votre scène."},
 {n:12, nom:"La culture d'entreprise", type:'quiz', places:3, min:8, desc:"10 questions sur Proxim'Services et votre métier. Chaque bonne réponse vaut 2 points : c'est l'épreuve qui rapporte le plus."},
 {n:13, nom:'Photos et vidéos', type:'jury', places:4, min:10, desc:"Relevez les défis photo et vidéo en équipe. Le jury note la réussite et la créativité."},
 {n:14, nom:'La tour de Babel', type:'hauteur', places:2, min:8, desc:"Chacun tient une ficelle : empilez les pièces sans les toucher. La tour la plus haute gagne."}
];
const EPN = Object.fromEntries(EP.map(e=>[e.n,e]));
const img = n => `proxim/ep${String(n).padStart(2,'0')}.jpg`;
const MAXPTS = e => e.type==='quiz' ? 20 : 10;
const BAREME = { duel:'Victoire 10 points · Égalité 6 · Défaite 3', jury:'La note du jury sur 10 donne vos points', quiz:'2 points par bonne réponse : jusqu\'à 20 points',
  chrono:'Classement entre toutes les équipes : de 10 points pour les plus rapides à 2 points', points:'Classement entre toutes les équipes : de 10 points pour les meilleurs scores à 2 points', hauteur:'Classement entre toutes les équipes : de 10 points pour les plus hautes tours à 2 points' };
const DEPART_PLAN = [[1,2],[2,3],[3,2],[4,2],[5,2],[6,2],[7,2],[8,1],[9,1],[10,2],[11,2],[12,3],[13,2],[14,2]];
const DEPART = {}; (()=>{ let t=1; DEPART_PLAN.forEach(([s,n])=>{ for(let i=0;i<n;i++) DEPART[t++]=s; }); })();

// =============== Petits outils ===============
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = k => 'pxc_'+EVENT+'_'+k;
const lsGet = (k,d)=>{ try{ const v=localStorage.getItem(LS(k)); return v===null?d:JSON.parse(v);}catch(e){return d;} };
const lsSet = (k,v)=>{ try{ localStorage.setItem(LS(k),JSON.stringify(v)); return true; }catch(e){ return false; } };
const fmtT = s => { s=Math.round(+s); return Math.floor(s/60)+' min '+String(s%60).padStart(2,'0')+' s'; };
const pl = (n,mot) => n+' '+mot+(n>1?'s':'');
const okPhoto = p => (typeof p==='string' && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(p)) ? p : '';
function sha256(ascii){
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  var mp=Math.pow, maxWord=mp(2,32), result='', words=[], bitLen=ascii.length*8, i, j;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], pc=k.length, comp={};
  for(var c=2; pc<64; c++){ if(!comp[c]){ for(i=0;i<313;i+=c) comp[i]=c; hash[pc]=(mp(c,.5)*maxWord)|0; k[pc++]=(mp(c,1/3)*maxWord)|0; } }
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); if(j>>8) return ''; words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bitLen/maxWord)|0); words[words.length]=(bitLen);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++){ for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); } }
  return result;
}
const empreinte = (quoi, code) => sha256('proxim14|'+quoi+'|'+String(code).trim().toUpperCase());
const codeOrgOk = code => !!code && empreinte('org',code) === EMPREINTES.org;
const codeStandOk = (stand, code) => !!code && (empreinte(stand,code) === (EMPREINTES.stands||{})[stand] || codeOrgOk(code));

// =============== État ===============

let state = {
  team: (tQ>=1 && tQ<=N_EQUIPES) ? tQ : lsGet('team',0),
  org: lsGet('org',false), view:'', ep:0, orgTab:'classement', orgRetour:false,
  passages:{}, equipes:{}, photos:{}, dbOk:null, err:'',
  saisie:{ res:'', bonus:{a:false,c:false,f:false} }, bravo:null, galerie:false, edition:false
};
if(state.team) lsSet('team', state.team);
let local = lsGet('local', { p:{}, e:{} });      // copies locales : passages et équipes
let queue = lsGet('queue', {});                   // envois en attente
const kp = (s,t)=>`${s}-${t}`;
const save = ()=>{ lsSet('local',local); lsSet('queue',queue); };

// =============== Base de données (REST Supabase) ===============
const H = { 'apikey':ANON, 'Authorization':'Bearer '+ANON, 'Content-Type':'application/json' };
async function dbGet(table, filtre){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?event=eq.${EVENT}&${filtre}`, {headers:H});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function dbUpsert(table, conflict, row){
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${conflict}`, {method:'POST', headers:{...H,'Prefer':'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(row)});
  if(!r.ok) throw new Error(await r.text());
}
let enFlush=false;
async function flush(){
  if(enFlush) return; enFlush=true;
  for(const k of Object.keys(queue)){
    const q=queue[k];
    try{ await dbUpsert(q.table, q.conflict, q.row); if(queue[k]===q) delete queue[k]; state.dbOk=true; }
    catch(e){ state.err=String(e.message||e); state.dbOk=false; break; }
  }
  enFlush=false; save(); renderDoux();
}
async function refresh(){
  try{
    const [p,e] = await Promise.all([
      dbGet('tb_passages','select=stand,team,resultat,mesure,b_ambiance,b_cohesion,b_fairplay,updated_at'),
      dbGet('tb_equipes','select=team,nom,capitaine,updated_at') ]);
    state.passages={}; p.forEach(x=>state.passages[kp(x.stand,x.team)]=x);
    state.equipes={}; e.forEach(x=>state.equipes[x.team]=x);
    state.dbOk=true; state.err='';
    chargerPhoto(state.team);
  }catch(e){ state.dbOk=false; state.err=String(e.message||e); }
  renderDoux();
}
async function chargerPhoto(t){
  if(!t || state.photos[t] || !equipe(t)) return;
  const loc = okPhoto(lsGet('photo_'+t,'')); if(loc){ state.photos[t]=loc; return; }
  try{ const r = await dbGet('tb_equipes',`team=eq.${t}&select=photo`); if(r[0] && okPhoto(r[0].photo)){ state.photos[t]=r[0].photo; renderDoux(); } }catch(e){}
}
function pousser(table, conflict, key, row){ queue[key]={table,conflict,row}; save(); flush(); }

// =============== Données fusionnées et calcul des points ===============
function passages(){
  const all={...state.passages};
  Object.entries(local.p).forEach(([k,r])=>{ if(!all[k] || (all[k].updated_at||'') <= r.updated_at) all[k]=r; });

}
function equipe(t){
  const a=state.equipes[t], b=local.e[t];
  if(a && b) return (a.updated_at||'') <= b.updated_at ? b : a;
  return b || a || null;
}
function calcul(){
  const rows = Object.values(passages()).filter(r=>r.resultat && r.resultat!=='X');
  const pts={}, rang={};
  EP.forEach(e=>{
    const list = rows.filter(r=>r.stand===e.n);
    if(e.type==='duel') list.forEach(r=>{ pts[kp(e.n,r.team)] = r.resultat==='V'?10 : r.resultat==='N'?6 : 3; });
    else if(e.type==='jury') list.forEach(r=>{ pts[kp(e.n,r.team)] = Math.max(0,Math.min(10,Math.round(+r.mesure||0))); });
    else if(e.type==='quiz') list.forEach(r=>{ pts[kp(e.n,r.team)] = 2*Math.max(0,Math.min(10,Math.round(+r.mesure||0))); });
    else { const v=list.filter(r=>r.mesure!=null), n=v.length, asc=e.type==='chrono';
      v.forEach(r=>{ const mieux=v.filter(x=> asc ? +x.mesure<+r.mesure : +x.mesure>+r.mesure).length; pts[kp(e.n,r.team)] = 10-2*Math.floor(5*mieux/n); rang[kp(e.n,r.team)]={r:mieux+1,n}; }); }
  });
  const eq={};
  for(let t=1;t<=N_EQUIPES;t++) eq[t]={t,faits:0,base:0,bonus:0,total:0,quiz:null};
  rows.forEach(r=>{ const e=eq[r.team]; if(!e) return; const p=pts[kp(r.stand,r.team)]; if(p==null) return;
    const b=(r.b_ambiance?1:0)+(r.b_cohesion?1:0)+(r.b_fairplay?1:0);
    e.faits++; e.base+=p; e.bonus+=b; e.total+=p+b; if(r.stand===12) e.quiz=Math.max(0,Math.min(10,Math.round(+r.mesure||0))); });
  const ordre = Object.values(eq).sort((a,b)=> b.total-a.total || b.faits-a.faits || (b.quiz||0)-(a.quiz||0) || a.t-b.t).map(e=>e.t);
  const general = eq[ordre[0]].total>0 ? ordre[0] : null;
  const qz = Object.values(eq).filter(e=>e.quiz!=null && e.t!==general).sort((a,b)=> b.quiz-a.quiz || b.total-a.total || a.t-b.t);
  const amb = Object.values(eq).filter(e=>e.bonus>0).sort((a,b)=> b.bonus-a.bonus || b.total-a.total || a.t-b.t);
  return { pts, rang, eq, ordre, general, prixQuiz: qz.length?qz[0].t:null, ambiance: amb.length?amb[0].t:null, saisies: rows.length };
}
function resteTxt(){
  const d=new Date(); const fin=new Date(2026,10,14,FIN.h,FIN.m);
  if(d.getFullYear()===2026 && d.getMonth()===10 && d.getDate()===14 && d<fin){
    const m=Math.ceil((fin-d)/60000); return m>=60 ? `Fin des épreuves dans ${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')}` : `Fin des épreuves dans ${m} min`;
  }
  return 'Fin des épreuves à 12h30';
}

  const nom=($('#fNom').value||'').trim(), cap=($('#fCap').value||'').trim(); const t=state.team; const photo=state.photos[t]||okPhoto(lsGet('photo_'+t,''));
  if(!nom){ alert('Donnez un nom à votre équipe.'); return; }
  if(!cap){ alert('Indiquez le prénom du capitaine.'); return; }
  if(!photo && !sansPhoto){ alert('Prenez la photo de toute l\'équipe (ou touchez « Continuer sans photo »).'); return; }
  const row={ event:EVENT, team:t, nom, capitaine:cap, code:CLE, updated_at:new Date().toISOString() };
  local.e[t]={team:t,nom,capitaine:cap,updated_at:row.updated_at};
  pousser('tb_equipes','event,team','e-'+t, photo ? {...row, photo} : row);
  state.edition=false; state.view='home'; render(); window.scrollTo(0,0);
};
window.modifierEquipe = ()=>{
  if(!state.org){ const c=prompt('Code de l\'animateur ou de l\'organisation :'); if(c===null) return; if(!Object.keys(EMPREINTES.stands||{}).some(s=>codeStandOk(+s,c)) ){ alert('Code incorrect.'); return; } }
  const e=equipe(state.team)||{}; lsSet('brouillon_nom',e.nom||''); lsSet('brouillon_cap',e.capitaine||''); state.edition=true; state.view='brief'; render(); window.scrollTo(0,0);
};
window.ouvrir = n=>{ state.ep=n; state.view='ep'; render(); window.scrollTo(0,0); };
window.demarrerSaisie = ()=>{ const r=passages()[kp(state.ep,state.team)]; const ok=r&&r.resultat&&r.resultat!=='X';
  state.saisie={ res: ok&&EPN[state.ep].type==='duel'?r.resultat:'', bonus:{a:!!(ok&&r.b_ambiance), c:!!(ok&&r.b_cohesion), f:!!(ok&&r.b_fairplay)} }; state.view='saisie'; render(); window.scrollTo(0,0); };
function garderChamps(){ const v={}; ['mm','ss','mv','codeA'].forEach(id=>{ const el=document.getElementById(id); if(el) v[id]=el.value; }); return v; }
function remettreChamps(v){ Object.entries(v).forEach(([id,val])=>{ const el=document.getElementById(id); if(el) el.value=val; }); }
window.setRes = r=>{ const v=garderChamps(); state.saisie.res=r; render(); remettreChamps(v); };
window.setBonus = k=>{ const v=garderChamps(); state.saisie.bonus[k]=!state.saisie.bonus[k]; render(); remettreChamps(v); };
function codeSaisieOk(){ if(state.org) return true; const c=$('#codeA')?$('#codeA').value:''; if(!codeStandOk(state.ep,c)){ alert('Code de l\'animateur incorrect.'); return false; } return true; }
window.validerSaisie = ()=>{
  const e=EPN[state.ep], t=state.team, s=state.saisie; let res='F', mes=null;
  if(e.type==='duel'){ if(!s.res){ alert('Choisissez Victoire, Égalité ou Défaite.'); return; } res=s.res; }
  else if(e.type==='chrono'){ const mm=+($('#mm').value||0), ss=+($('#ss').value||0); if(mm<0||ss<0||ss>59||(mm===0&&ss===0)){ alert('Saisissez le temps en minutes et secondes.'); return; } mes=mm*60+ss; }
  else { const v=$('#mv').value; if(v===''||isNaN(+v)||+v<0){ alert('Saisissez le résultat.'); return; } if((e.type==='jury'||e.type==='quiz') && +v>10){ alert('La valeur doit être comprise entre 0 et 10.'); return; } mes=+v; }
  if(!codeSaisieOk()) return;
  const row={ event:EVENT, stand:e.n, team:t, resultat:res, mesure:mes, b_ambiance:s.bonus.a, b_cohesion:s.bonus.c, b_fairplay:s.bonus.f, code:CLE, updated_at:new Date().toISOString() };
  local.p[kp(e.n,t)]=row; pousser('tb_passages','event,stand,team','p-'+kp(e.n,t),row);
  const c=calcul(); const p=c.pts[kp(e.n,t)]||0; const b=(s.bonus.a?1:0)+(s.bonus.c?1:0)+(s.bonus.f?1:0); const rg=c.rang[kp(e.n,t)];
  state.bravo={ titre:`${e.nom} : c'est validé !`, pts:'+'+(p+b), sous:`points pour l'équipe ${t}`+(b?` dont ${b} bonus`:'')+(rg?`<br>${rg.r}${rg.r===1?'er':'e'} sur ${pl(rg.n,'équipe')} pour l'instant`:'') };
  state.view='bravo'; render(); window.scrollTo(0,0);
};
window.supprimerPassage = ()=>{
  if(!confirm('Effacer le résultat de cette épreuve pour cette équipe ?')) return; if(!codeSaisieOk()) return;
  const e=EPN[state.ep], t=state.team; const row={ event:EVENT, stand:e.n, team:t, resultat:'X', mesure:null, b_ambiance:false, b_cohesion:false, b_fairplay:false, code:CLE, updated_at:new Date().toISOString() };
  local.p[kp(e.n,t)]=row; pousser('tb_passages','event,stand,team','p-'+kp(e.n,t),row); aller('ep');
};
window.refresh=refresh;
window.addEventListener('online', flush);
setInterval(()=>{ flush(); refresh(); }, 20000);
if(Q.has('org')){ if(!tQ) state.team=0; state.view = state.org ? 'org' : 'landing'; }
render(); refresh();
</script>
</body>
