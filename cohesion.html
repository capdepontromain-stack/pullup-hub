<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Journée de cohésion Proxim'Services</title>
<meta name="description" content="Journée de cohésion Proxim'Services, samedi 14 novembre 2026 : le carnet de route des équipes, les épreuves et les points.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B4F86">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="proxim/logo-proxim.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bleu:#0085B2; --marine:#0B4F86; --nuit:#072B4C; --orange:#F7941D; --corail:#EF5A24; --jaune:#FDCC1A; --rouge:#E3222B; --vert:#22A45D; --vertf:#178048; --fond:#EFF5FA; --texte:#14304A; --gris:#5C6F82; --trait:#DCE7F0; --ombre:0 6px 18px rgba(11,79,134,.10);
    --titre:'Baloo 2', 'Nunito', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; --corps:'Nunito', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:var(--corps); background:var(--fond); color:var(--texte); font-size:16.5px; line-height:1.4; font-weight:500; min-height:100vh; }
  button { font-family:inherit; cursor:pointer; }
  button:active { transform:scale(.97); }
  /* ---------- En-tête ---------- */
  header.top { background:#fff; padding:8px 12px 9px; text-align:center; position:sticky; top:0; z-index:8; box-shadow:0 2px 10px rgba(11,79,134,.08); padding-top:max(8px, env(safe-area-inset-top)); }
  header.top::after { content:''; position:absolute; left:0; right:0; bottom:-4px; height:4px; background:linear-gradient(90deg,var(--orange),var(--rouge) 30%,var(--bleu) 65%,var(--jaune)); }
  header.top .logo { height:34px; max-width:78%; object-fit:contain; display:block; margin:0 auto; }
  header.top .ligne { display:flex; gap:6px; justify-content:center; align-items:center; margin-top:6px; flex-wrap:wrap; }
  header.top .titre { background:var(--orange); color:#fff; font-family:var(--titre); font-weight:800; font-size:13px; letter-spacing:.5px; padding:2px 11px 1px; border-radius:20px; text-transform:uppercase; }
  .rebours { font-weight:900; font-size:13.5px; color:var(--marine); background:#E6F1F8; padding:2px 10px; border-radius:20px; font-variant-numeric:tabular-nums; }
  .rebours.urgent { color:#fff; background:var(--rouge); animation:pouls 1.2s ease-in-out infinite; }
  .rebours.fini { color:#fff; background:var(--vert); }
  @keyframes pouls { 50% { transform:scale(1.06); } }
  main { padding:16px 14px; max-width:620px; margin:0 auto; }
  /* ---------- Éléments communs ---------- */
  .card { background:#fff; border-radius:20px; padding:18px; margin-bottom:14px; box-shadow:var(--ombre); }
  h1, h2, h3, .t-titre { font-family:var(--titre); font-weight:800; letter-spacing:-.2px; }
  h1 { font-size:30px; line-height:1.05; margin:0 0 6px; color:var(--marine); }
  h2 { font-size:23px; line-height:1.1; margin:0 0 8px; color:var(--marine); }
  h3 { font-size:19px; margin:20px 2px 10px; color:var(--marine); display:flex; align-items:center; gap:8px; }
  h3 .cpt { font-family:var(--corps); font-size:13px; background:var(--marine); color:#fff; border-radius:20px; padding:1px 9px; font-weight:900; }
  p { margin:0 0 8px; }
  .muted { color:var(--gris); font-size:14px; }
  label { display:block; font-size:14px; font-weight:800; color:var(--marine); margin:14px 0 6px; }
  input[type=text], input[type=number], input[type=password], input[type=tel] { width:100%; font-size:19px; font-family:inherit; font-weight:700; padding:13px 14px; border:2px solid var(--trait); border-radius:14px; background:#fff; color:var(--texte); -webkit-appearance:none; appearance:none; }
  input::placeholder { color:#9AAABB; font-weight:600; }
  input:focus { outline:none; border-color:var(--bleu); box-shadow:0 0 0 4px rgba(0,133,178,.15); }
  .btn { display:block; width:100%; border:0; border-radius:16px; padding:16px 14px; font-size:18px; font-weight:900; color:#fff; background:var(--bleu); margin-top:12px; font-family:var(--corps); box-shadow:0 4px 0 rgba(0,0,0,.12); transition:transform .08s; }
  .btn.orange { background:linear-gradient(180deg,#FBA43A,var(--orange)); } .btn.vert { background:linear-gradient(180deg,#2DBB6C,var(--vert)); } .btn.marine { background:var(--marine); }
  .btn.or { background:linear-gradient(180deg,#FFE066,var(--jaune)); color:var(--nuit); }
  .btn.clair { background:#fff; color:var(--marine); border:2px solid var(--trait); box-shadow:none; }
  .btn.gros { font-size:21px; padding:19px 14px; }
  .lnk { background:none; border:0; color:var(--gris); text-decoration:underline; font-size:14.5px; padding:10px 6px; font-weight:700; }
  .tag { display:inline-block; font-size:11.5px; font-weight:900; padding:3px 8px; border-radius:8px; margin:4px 4px 0 0; color:#fff; background:var(--bleu); letter-spacing:.2px; }
  .tag.pts { background:var(--vert); } .tag.duel { background:var(--rouge); } .tag.double { background:var(--orange); } .tag.gris { background:#E9EFF5; color:var(--gris); }
  .banner { background:#FFF4D1; border:1px solid #F1D675; color:#6A5200; padding:11px 13px; border-radius:14px; font-size:14.5px; margin-bottom:12px; }
  .banner.err { background:#FDE7E7; border-color:#EDB1B1; color:#8A1C1C; }
  .banner.bleu { background:#E2F3FA; border-color:#A9D8EA; color:var(--marine); }
  .banner.vert { background:#E3F6EA; border-color:#A6DDB9; color:var(--vertf); }
  .banner .lnk { padding:2px 0; font-size:13.5px; }
  /* ---------- Accueil ---------- */
  .heroAcc { height:230px; border-radius:24px; background:center/cover; position:relative; overflow:hidden; box-shadow:var(--ombre); }
  .heroAcc::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(7,43,76,0) 40%,rgba(7,43,76,.75)); }
  .heroAcc .surt { position:absolute; left:18px; bottom:40px; z-index:1; color:#fff; font-family:var(--titre); font-weight:800; font-size:15px; letter-spacing:1.5px; text-transform:uppercase; }
  .accCarte { text-align:center; margin-top:-26px; position:relative; z-index:2; }
  .accCarte h1 { font-size:34px; }
  .accCarte .sous { font-size:19px; margin:6px 0 2px; }
  .respire { animation:respire 2.2s ease-in-out infinite; }
  @keyframes respire { 50% { transform:scale(1.03); box-shadow:0 8px 24px rgba(247,148,29,.45); } }
  /* ---------- Formulaire équipe ---------- */
  .gnum { font-family:var(--titre); font-size:34px !important; text-align:center; letter-spacing:2px; padding:8px !important; }
  .photoEq { height:200px; border-radius:16px; background:var(--trait) center/cover; margin-top:6px; position:relative; }
  .photoEq span { position:absolute; left:10px; bottom:10px; background:rgba(34,164,93,.95); color:#fff; font-weight:900; padding:4px 11px; border-radius:10px; font-size:13.5px; }
  .deja { border-radius:18px; padding:16px; margin-top:16px; background:linear-gradient(160deg,#E2F3FA,#fff); border:2px solid #A9D8EA; }
  .deja .n { font-family:var(--titre); font-size:26px; font-weight:800; color:var(--marine); line-height:1.1; }
  /* ---------- Règles ---------- */
  .regles { list-style:none; padding:0; margin:0; }
  .regles li { display:flex; gap:12px; align-items:flex-start; padding:11px 0; border-bottom:1px solid var(--trait); }
  .regles li:last-child { border-bottom:0; }
  .num { flex:0 0 32px; height:32px; border-radius:50%; color:#fff; font-weight:900; display:flex; align-items:center; justify-content:center; font-size:15px; font-family:var(--titre); }
  details.regl { background:#fff; border-radius:20px; box-shadow:var(--ombre); margin:16px 0 14px; overflow:hidden; }
  details.regl summary { list-style:none; padding:16px 18px; font-family:var(--titre); font-weight:800; font-size:18px; color:var(--marine); display:flex; justify-content:space-between; align-items:center; }
  details.regl summary::-webkit-details-marker { display:none; }
  details.regl summary::after { content:'+'; font-size:26px; line-height:1; color:var(--bleu); }
  details.regl[open] summary::after { content:'–'; }
  details.regl > div { padding:0 18px 16px; }
  /* ---------- Carnet de l'équipe ---------- */
  .eqCarte { display:flex; gap:14px; align-items:center; }
  .avatar { flex:0 0 78px; height:78px; border-radius:50%; background:var(--trait) center/cover; border:4px solid #fff; box-shadow:0 0 0 3px var(--orange); display:flex; align-items:center; justify-content:center; font-family:var(--titre); font-weight:800; font-size:28px; color:#fff; }
  .eqCarte .nom { font-family:var(--titre); font-size:25px; font-weight:800; color:var(--marine); line-height:1.02; }
  .eqCarte .det { color:var(--gris); font-size:14px; font-weight:700; margin-top:3px; }
  .avance { display:flex; align-items:center; gap:14px; margin-top:16px; background:var(--fond); border-radius:16px; padding:12px 14px; }
  .anneau { flex:0 0 84px; height:84px; position:relative; }
  .anneau svg { width:84px; height:84px; transform:rotate(-90deg); }
  .anneau circle { fill:none; stroke-width:9; }
  .anneau .bg { stroke:#DCE7F0; } .anneau .fg { stroke:url(#degrade); stroke-linecap:round; transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1); }
  .anneau b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--titre); font-size:24px; font-weight:800; color:var(--marine); }
  .anneau b small { font-size:14px; color:var(--gris); margin-left:1px; }
  .avance .txt { font-weight:800; font-size:16px; line-height:1.25; }
  .avance .txt .muted { font-weight:600; display:block; margin-top:3px; }
  .ep { display:flex; align-items:stretch; background:#fff; border-radius:18px; overflow:hidden; margin-bottom:11px; box-shadow:var(--ombre); border:0; width:100%; text-align:left; padding:0; color:inherit; font:inherit; position:relative; }
  .ep .img { flex:0 0 100px; background:var(--trait) center/cover; min-height:96px; position:relative; }
  .ep .img i { position:absolute; left:7px; top:7px; background:var(--marine); color:#fff; font-style:normal; font-weight:900; font-size:13px; width:27px; height:27px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid #fff; }
  .ep .txt { flex:1; padding:11px 12px; min-width:0; }
  .ep .t { font-family:var(--titre); font-weight:800; font-size:18.5px; color:var(--marine); line-height:1.1; }
  .ep .go { flex:0 0 58px; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(180deg,#2DBB6C,var(--vert)); color:#fff; font-weight:900; font-size:11px; letter-spacing:.4px; text-align:center; gap:2px; }
  .ep .go b { font-size:24px; line-height:1; }
  .ep.culture { box-shadow:0 0 0 3px var(--orange), var(--ombre); }
  .ep.culture .img { background-color:#fff; background-size:contain; background-repeat:no-repeat; }
  .vedette { display:block; width:100%; text-align:left; border:0; padding:0; border-radius:22px; overflow:hidden; margin-bottom:6px; color:#fff; font:inherit; background:linear-gradient(135deg,var(--orange),var(--corail)); box-shadow:0 8px 22px rgba(239,90,36,.35); }
  .vedette .img { height:112px; background:#fff center/contain no-repeat; }
  .vedette .txt { padding:13px 16px 16px; }
  .vedette .t { font-family:var(--titre); font-size:23px; font-weight:800; line-height:1.08; }
  .vedette .d { display:inline-block; background:var(--jaune); color:var(--nuit); font-weight:900; font-size:13px; padding:4px 11px; border-radius:10px; margin-top:9px; }
  @keyframes clignote { 0%,100% { transform:scale(1); box-shadow:0 8px 22px rgba(239,90,36,.35); filter:none; } 50% { transform:scale(1.025); box-shadow:0 0 0 7px rgba(253,204,26,.9), 0 10px 26px rgba(227,34,43,.5); filter:brightness(1.1); } }
  .vedette.clignote { animation:clignote 1.1s ease-in-out infinite; }
  .faites { display:flex; flex-wrap:wrap; gap:7px; }
  .faite { display:inline-flex; align-items:center; gap:6px; border:0; background:#FCE9E9; color:var(--rouge); border-radius:20px; padding:6px 11px 6px 6px; font:inherit; font-size:13.5px; font-weight:800; text-decoration:line-through; text-decoration-thickness:1.5px; }
  .faite i { font-style:normal; background:var(--rouge); color:#fff; border-radius:50%; width:22px; height:22px; display:inline-flex; align-items:center; justify-content:center; font-size:12px; text-decoration:none; }
  .faite.tampon { animation:tampon .9s cubic-bezier(.2,1.6,.4,1) both; }
  @keyframes tampon { 0% { transform:scale(2.2) rotate(-12deg); opacity:0; } 60% { transform:scale(.92) rotate(3deg); opacity:1; } 100% { transform:none; } }
  .finCarte { text-align:center; padding:26px 18px; background:linear-gradient(160deg,var(--vert),var(--vertf)); color:#fff; border-radius:22px; margin-bottom:14px; box-shadow:var(--ombre); }
  .finCarte .p { font-family:var(--titre); font-size:46px; font-weight:800; line-height:1; color:var(--jaune); }
  .annonce { display:flex; gap:12px; align-items:flex-start; background:linear-gradient(135deg,var(--marine),var(--bleu)); color:#fff; border-radius:18px; padding:14px 16px; margin-bottom:14px; box-shadow:var(--ombre); }
  .annonce .ico { font-size:28px; line-height:1; }
  .annonce b { color:var(--jaune); font-size:12.5px; letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:2px; }
  .annonce .lnk { color:#CFE4F3; padding:6px 0 0; }
  /* ---------- Épreuve ---------- */
  .heroEp { height:220px; border-radius:22px; background:var(--trait) center/cover; margin-bottom:14px; position:relative; overflow:hidden; box-shadow:var(--ombre); }
  .heroEp.logo { background-size:80%; background-repeat:no-repeat; background-color:#fff; }
  .heroEp::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(7,43,76,0) 45%,rgba(7,43,76,.85)); }
  .heroEp .tt { position:absolute; left:16px; right:16px; bottom:12px; z-index:1; color:#fff; }
  .heroEp .tt small { font-weight:900; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--jaune); }
  .heroEp .tt div { font-family:var(--titre); font-size:30px; font-weight:800; line-height:1.05; }
  .fait { text-align:center; border-radius:20px; padding:20px 16px; background:#FCE9E9; color:var(--rouge); margin-bottom:6px; }
  .fait .gros { font-family:var(--titre); font-size:28px; font-weight:800; }
  .defi { display:flex; gap:12px; align-items:center; background:#fff; border-radius:18px; padding:12px; margin-bottom:10px; box-shadow:var(--ombre); }
  .defi .ico { flex:0 0 52px; height:52px; border-radius:50%; background:var(--fond); display:flex; align-items:center; justify-content:center; font-size:26px; }
  .defi .txt { flex:1; min-width:0; } .defi .t { font-family:var(--titre); font-weight:800; font-size:18px; color:var(--marine); line-height:1.1; } .defi .muted { font-size:13.5px; margin-top:2px; }
  .defi .faireBtn { flex:0 0 auto; border:0; border-radius:14px; padding:13px 16px; font-weight:900; font-size:16px; color:#fff; background:linear-gradient(180deg,#FBA43A,var(--orange)); box-shadow:0 3px 0 rgba(0,0,0,.12); }
  .defi.ok { background:#FCE9E9; box-shadow:none; } .defi.ok .ico { background:var(--rouge); color:#fff; font-weight:900; } .defi.ok .t { color:var(--rouge); text-decoration:line-through; }
  .defi .st { font-size:11px; font-weight:900; color:var(--rouge); letter-spacing:.5px; }
  .noteDefi { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--trait); }
  .noteDefi:last-child { border-bottom:0; } .noteDefi .hd { flex:1; min-width:0; font-size:14px; }
  .notes4 { display:flex; gap:5px; flex:0 0 auto; }
  .notes4 button { width:40px; height:40px; border-radius:12px; border:2px solid var(--trait); background:#fff; font-family:var(--titre); font-weight:800; font-size:18px; color:var(--marine); }
  .notes4 button.sel { background:var(--marine); border-color:var(--marine); color:#fff; } .notes4 button.auto { border-color:var(--bleu); border-style:dashed; color:var(--bleu); }
  .filtre { display:flex; gap:8px; } .filtre button { flex:1; border:2px solid var(--trait); background:#fff; border-radius:12px; padding:10px; font-weight:900; color:var(--gris); font-size:14px; }
  .filtre button.on { background:var(--marine); border-color:var(--marine); color:#fff; }
  td .detail { font-size:11.5px; color:var(--gris); font-weight:700; margin-top:2px; line-height:1.3; }
  .btn:disabled { opacity:.55; }
  header.top .titre { max-width:70vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } header.top .titre.eq { background:var(--marine); }
  .passage { text-align:center; color:#fff; background:linear-gradient(170deg,var(--marine),var(--nuit)); border-radius:24px; padding:30px 20px 22px; box-shadow:0 10px 26px rgba(7,43,76,.35); }
  .passage .mainP { font-size:74px; line-height:1; animation:tendre 1.4s ease-in-out infinite; }
  @keyframes tendre { 0%,100% { transform:translateX(-10px) rotate(-8deg); } 50% { transform:translateX(10px) rotate(8deg); } }
  .passage .pt { color:var(--jaune); font-weight:900; letter-spacing:1.5px; text-transform:uppercase; font-size:13px; margin-top:12px; }
  .passage h1 { color:#fff; font-size:31px; margin:6px 0 16px; }
  .passage .qui2 { display:flex; gap:12px; align-items:center; text-align:left; background:rgba(255,255,255,.1); border-radius:16px; padding:12px; font-size:15px; }
  .passage .qui2 .avatar { flex:0 0 56px; height:56px; font-size:22px; border-width:2px; box-shadow:0 0 0 2px var(--jaune); }
  details.conseils { background:rgba(253,204,26,.12); border:1px solid rgba(253,204,26,.45); border-radius:14px; margin:12px 0 2px; }
  details.conseils summary { list-style:none; padding:10px 12px; font-weight:900; color:var(--jaune); font-size:15px; } details.conseils summary::-webkit-details-marker { display:none; }
  details.conseils ul { margin:0; padding:0 14px 10px 30px; font-size:14px; color:#EAF3FA; } details.conseils li { margin:4px 0; }
  .chrono { display:flex; gap:8px; align-items:center; margin-top:10px; }
  .chrono .aff { flex:1; font-family:var(--titre); font-weight:800; font-size:30px; color:var(--jaune); background:rgba(0,0,0,.25); border-radius:14px; padding:6px 12px; text-align:center; font-variant-numeric:tabular-nums; }
  .chrono button { border:0; border-radius:14px; padding:14px 14px; font-weight:900; font-size:16px; background:#2DBB6C; color:#fff; }
  .chrono button.run { background:#F05A5A; } .chrono button.z { background:rgba(255,255,255,.15); }
  .rendre { text-align:center; background:var(--jaune); color:var(--nuit); font-weight:900; border-radius:14px; padding:10px; margin-bottom:10px; animation:pouls 1.4s ease-in-out 3; }
  .palier { display:inline-block; margin-top:12px; background:var(--jaune); color:var(--nuit); font-weight:900; border-radius:20px; padding:6px 14px; animation:revele .7s cubic-bezier(.2,1.4,.4,1) both; }
  .rappelDefis { display:flex; gap:12px; align-items:center; width:100%; text-align:left; border:0; border-radius:18px; padding:14px 16px; margin-bottom:12px; background:linear-gradient(135deg,#7B4FC4,#E2558C); color:#fff; font:inherit; box-shadow:var(--ombre); }
  .rappelDefis span { font-size:34px; }
  .aller { display:flex; gap:8px; margin:12px 0 0; } .aller input { flex:1; font-size:17px; padding:11px 12px; } .aller button { border:0; border-radius:14px; padding:0 16px; background:var(--marine); color:#fff; font-weight:900; font-size:15px; }
  .row .btn { margin-top:12px; }
  /* ---------- Saisie animateur ---------- */
  .anim { background:linear-gradient(170deg,var(--marine),var(--nuit)); color:#fff; border-radius:22px; padding:18px; margin-bottom:14px; box-shadow:0 10px 26px rgba(7,43,76,.35); }
  .anim h2 { color:var(--jaune); margin:0; }
  .anim .qui { display:flex; gap:12px; align-items:center; margin:10px 0 4px; background:rgba(255,255,255,.08); border-radius:14px; padding:10px; }
  .anim .qui .avatar { flex:0 0 52px; height:52px; font-size:20px; border-width:2px; box-shadow:0 0 0 2px var(--jaune); }
  .anim label { color:#fff; font-size:15px; margin-top:18px; }
  .anim .muted { color:#C9DCEC; }
  .anim input { background:#fff; }
  .choix { display:flex; gap:8px; }
  .choix button, .notes button, .bonus button { flex:1; padding:14px 4px; border-radius:14px; border:2px solid rgba(255,255,255,.55); background:transparent; color:#fff; font-weight:900; font-size:16px; }

function sha256(ascii){
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  var mp=Math.pow, maxWord=mp(2,32), result='', words=[], bitLen=ascii.length*8, i, j;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], pc=k.length, comp={};
  for(var c=2; pc<64; c++){ if(!comp[c]){ for(i=0;i<313;i+=c) comp[i]=c; hash[pc]=(mp(c,.5)*maxWord)|0; k[pc++]=(mp(c,1/3)*maxWord)|0; } }
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); if(j>>8) return ''; words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bitLen/maxWord)|0); words[words.length]=(bitLen);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++){ for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); } }
  return result;
}

function confettis(fort){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='confettis'; document.body.appendChild(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1), W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr, ctx=cv.getContext('2d');
  const cols=['#F7941D','#E3222B','#0085B2','#FDCC1A','#22A45D','#ffffff','#EF5A24'];
  const ps=Array.from({length:fort?240:130},(_,i)=>({ x:W*(fort?Math.random():.5+(Math.random()-.5)*.4), y:fort?-20*dpr-Math.random()*H*.5:H*.38, vx:(Math.random()-.5)*(fort?4:16)*dpr, vy:fort?(2+Math.random()*3)*dpr:-(6+Math.random()*10)*dpr,
    r:(5+Math.random()*6)*dpr, c:cols[i%cols.length], a:Math.random()*6, va:(Math.random()-.5)*.35, f:Math.random()<.5 }));
  const t0=performance.now(), duree=fort?4500:2800;
  (function anim(t){ ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy+=.28*dpr; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; if(p.f){ ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); } else { ctx.beginPath(); ctx.arc(0,0,p.r/3,0,6.3); ctx.fill(); } ctx.restore(); });
    if(t-t0<duree) requestAnimationFrame(anim); else cv.remove(); })(t0);
}

async function appel(url, opts, delai){            // requête avec délai maximum : un réseau faible ne bloque jamais l'écran
  const ctl = ('AbortController' in window) ? new AbortController() : null; const tm = setTimeout(()=>{ try{ ctl && ctl.abort(); }catch(e){} }, delai||12000);
  try{ return await fetch(url, {...opts, signal: ctl?ctl.signal:undefined}); }
  catch(e){ const err=new Error('Pas de réseau'); err.statut=0; throw err; }
  finally{ clearTimeout(tm); }
}
async function dbGet(table, filtre){
  const r = await appel(`${SUPABASE_URL}/rest/v1/${table}?event=eq.${EVENT}&${filtre}`, {headers:H});
  if(!r.ok){ const err=new Error(await r.text()); err.statut=r.status; throw err; }
  return r.json();
}
async function dbUpsert(table, conflict, row){
  let corps={...row}; if(SANS_COEUR) delete corps.b_coeur;
  for(let i=0;i<3;i++){
    const r = await appel(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${conflict}`, {method:'POST', headers:{...H,'Prefer':'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(corps)}, corps.photo?25000:12000);
    if(r.ok) return;
    const txt = await r.text();
    if('b_coeur' in corps && /b_coeur/.test(txt)){ SANS_COEUR=true; delete corps.b_coeur; continue; }
    if(r.status===413 && corps.photo){ delete corps.photo; continue; }     // photo trop lourde : on garde l'inscription sans la photo
    const err=new Error(txt); err.statut=r.status; throw err;
  }
}
let enFlush=false, reFlush=false;
async function flush(){
  if(enFlush){ reFlush=true; return; } enFlush=true; reFlush=false; let ok=0; const tentes=new Set();
  for(const k of Object.keys(queue)){ tentes.add(k);
    const q=queue[k];
    try{ await dbUpsert(q.table, q.conflict, q.row); if(queue[k]===q) delete queue[k]; state.dbOk=true; ok++; }
    catch(e){
      if(e.statut>=400 && e.statut<500 && e.statut!==408 && e.statut!==429){ q.ko=(q.ko||0)+1; q.msg=String(e.message||'').slice(0,160); continue; }   // refus de la base : on n'empêche pas les autres envois
      state.dbOk=false; state.err=String(e.message||e); break;
    }
  }
  enFlush=false; save(); majEnvoi(); renderDoux();
  if(state.dbOk!==false && (reFlush || Object.keys(queue).some(k=>!tentes.has(k)))) setTimeout(flush, 50);   // un envoi arrivé pendant le précédent part tout de suite
}

function calcul(){
  const rows = Object.values(passages()).filter(r=>valide(r) && r.stand>=1 && r.stand<=NB_EP);
  const pts={}, rang={};
  EP.forEach(e=>{
    const list = rows.filter(r=>r.stand===e.n);
    if(e.type==='duel') list.forEach(r=>{ pts[kp(e.n,r.team)] = r.resultat==='V'?10 : r.resultat==='N'?6 : 3; });
    else if(e.type==='jury') list.forEach(r=>{ pts[kp(e.n,r.team)] = Math.max(0,Math.min(10,Math.round(+r.mesure||0))); });
    else if(e.type==='quiz') list.forEach(r=>{ pts[kp(e.n,r.team)] = 2*Math.max(0,Math.min(10,Math.round(+r.mesure||0))); });
    else { const v=list.filter(r=>r.mesure!=null), n=v.length, asc=e.type==='chrono';
      v.forEach(r=>{ const mieux=v.filter(x=> asc ? +x.mesure<+r.mesure : +x.mesure>+r.mesure).length; pts[kp(e.n,r.team)] = 10-2*Math.floor(5*mieux/n); rang[kp(e.n,r.team)]={r:mieux+1,n}; }); }
  });
  const eq={};
  for(let t=1;t<=N_EQUIPES;t++) eq[t]={t,faits:0,base:0,bonus:0,coeurs:0,fairplay:0,photos:0,nbDefis:0,total:0,quiz:null};
  rows.forEach(r=>{ const e=eq[r.team]; if(!e) return; const p=pts[kp(r.stand,r.team)]; if(p==null) return;
    const b=ptsBonus(r);

function photoAvecBandeau(source, legende, nom){ return new Promise((ok,ko)=>{
  const url = typeof source==='string' ? source : URL.createObjectURL(source); const im=new Image();
  im.onload=()=>{ const max=1600, k=Math.min(1,max/Math.max(im.width,im.height)); const w=Math.round(im.width*k), h=Math.round(im.height*k); const bh=Math.max(46,Math.round(Math.max(w,h)*0.055));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h+bh; const c=cv.getContext('2d'); c.drawImage(im,0,0,w,h);
    c.fillStyle='#0B4F86'; c.fillRect(0,h,w,bh); c.fillStyle='#FDCC1A'; c.fillRect(0,h,w,Math.max(3,bh*0.07)); c.fillStyle='#fff'; c.font=`bold ${Math.round(bh*0.42)}px Arial, sans-serif`; c.textBaseline='middle'; c.fillText(legende, Math.round(bh*0.3), h+bh*0.55, w-bh*0.6);
    if(typeof source!=='string') URL.revokeObjectURL(url);
    cv.toBlob(b=>{ if(!b) return ko(); ok({ fichier:new File([b], nom, {type:'image/jpeg'}), apercu:cv.toDataURL('image/jpeg',0.45) }); }, 'image/jpeg', 0.85); };
  im.onerror=()=>ko(); im.src=url; }); }

// ---------- Podium : on dévoile les gagnants un par un ----------
function etapesPodium(){

  if(top[2]) st.push({t:top[2], titre:'3e place', ico:'🥉', sous:e=>`${e.total} points · ${pl(e.faits,'épreuve')}`});
  if(top[1]) st.push({t:top[1], titre:'2e place', ico:'🥈', sous:e=>`${e.total} points · ${pl(e.faits,'épreuve')}`});

window.validerSaisie = ()=>{
  const e=EPN[state.ep], t=state.team, s=state.saisie; const lu=lireSaisie();
  if(lu.erreur){ dire(lu.erreur,'err'); return; }
  const mes=lu.mes, res=lu.res;
  // valeurs étonnantes : on fait confirmer
  const bizarre = (e.type==='chrono' && (mes<10 || mes>20*60)) ? 'Temps de '+fmtT(mes)+' : c\'est bien ça ?' : (e.type==='points' && mes>300) ? mes+' points : c\'est bien ça ?' : (e.type==='hauteur' && mes>400) ? mes+' cm : c\'est bien ça ?' : '';
  if(bizarre && !confirm(bizarre)) return;
  if(!codeSaisieOk()) return;
  const maintenant=new Date().toISOString(); const etaitFait=fait(e.n,t);
  const row={ event:EVENT, stand:e.n, team:t, resultat:res, mesure:mes, code:CLE, updated_at:maintenant }; BONUS.forEach(b=>row[b.col]=!!s.bonus[b.k]);
  local.p[kp(e.n,t)]=row; pousser('tb_passages','event,stand,team','p-'+kp(e.n,t),row);
  // Duel : on enregistre aussi le résultat de l'équipe adverse (sauf si elle a déjà un résultat contre une autre équipe)
  let noteAdv='';
  if(e.type==='duel' && mes>0){ const r2=passages()[kp(e.n,mes)];
    if(valide(r2) && r2.mesure!=null && +r2.mesure!==t) noteAdv=`L'équipe ${mes} avait déjà un résultat contre une autre équipe : il n'a pas été modifié.`;
    else { const row2={ event:EVENT, stand:e.n, team:mes, resultat:inverse(res), mesure:t, code:CLE, updated_at:maintenant };
      if(state.org && valide(r2)) BONUS.forEach(b=>row2[b.col]=!!r2[b.col]);          // sinon on n'envoie pas les bonus : la base garde ceux déjà donnés à l'équipe adverse
      local.p[kp(e.n,mes)]={...(r2||{}), ...row2}; pousser('tb_passages','event,stand,team','p-'+kp(e.n,mes),row2); } }
  state.saisie=null; vibre([30,40,30]); cacherToast();
  if(state.org && state.orgRetour){ dire('Résultat enregistré ✓'+(noteAdv?' '+noteAdv:''),'ok'); const a=state.apresSaisie; state.apresSaisie=''; if(a==='org') aller('org'); else { state.view='home'; render(); window.scrollTo(0,0); } return; }
  state.bravo={ ep:e.n }; state.vientDeFaire=e.n; setTimeout(()=>{ state.vientDeFaire=0; }, 4000);
  const nbF=EP.filter(x=>x.n!==DEFI_EP && fait(x.n,t)).length, palier=[5,10,NB_EP].includes(nbF) && !etaitFait;
  state.view='bravo'; render(); window.scrollTo(0,0); confettis(palier); son(palier); if(noteAdv) setTimeout(()=>dire(noteAdv),1200); if(etaitFait) setTimeout(()=>dire('Résultat corrigé ✓','ok'),400);
};

  L.push(['Rang','Équipe','Nom','Capitaine','Total','Points épreuves','Bonus','Photos-vidéos','Épreuves faites','Défis envoyés','Coups de cœur','Fair-play','Culture (sur 10)'].concat(EP.filter(e=>e.n!==DEFI_EP).map(e=>e.n+'. '+e.nom)).map(q).join(';'));
  c.ordre.forEach((t,i)=>{ const e=c.eq[t], eqp=equipe(t)||{}; L.push([i+1,t,eqp.nom||'',eqp.capitaine||'',e.total,e.base,e.bonus,e.photos,e.faits,e.nbDefis,e.coeurs,e.fairplay,e.quiz==null?'':e.quiz]
    .concat(EP.filter(x=>x.n!==DEFI_EP).map(x=>{ const r=passages()[kp(x.n,t)]; return valide(r)&&c.pts[kp(x.n,t)]!=null ? c.pts[kp(x.n,t)]+ptsBonus(r) : ''; })).map(q).join(';')); });
  const blob=new Blob(['﻿'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`classement-cohesion-proxim-${new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')}.csv`; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); dire('Tableau téléchargé : il s\'ouvre dans Excel','ok'); };
window.partagerClassement = async ()=>{
  const c=calcul(); const top=c.ordre.filter(t=>c.eq[t].total>0);
  let txt = `Journée de cohésion Proxim'Services · classement à ${heure(Date.now())}\n\n`;
  top.slice(0,10).forEach((t,i)=>{ txt += `${['🥇','🥈','🥉'][i]||(i+1)+'.'} Équipe ${t} ${nomEq(t)} : ${c.eq[t].total} pts (${c.eq[t].faits} épreuves)\n`; });
  if(c.prixQuiz) txt += `\n🎓 Médaille culture d'entreprise : équipe ${c.prixQuiz} ${nomEq(c.prixQuiz)}`;
  if(c.ambiance) txt += `\n❤️ Trophée coups de cœur et fair-play : équipe ${c.ambiance} ${nomEq(c.ambiance)}`;
  try{ if(navigator.share){ await navigator.share({text:txt}); return; } }catch(e){ return; }
  try{ await navigator.clipboard.writeText(txt); dire('Classement copié : collez-le dans WhatsApp','ok'); }catch(e){ prompt('Copiez le classement :', txt); }
};
