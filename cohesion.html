<style>
  :root { --bleu:#0784B0; --marine:#0D6897; --nuit:#073F5E; --orange:#F26B12; --corail:#E8540C; --jaune:#F9CB19; --rouge:#EC0512; --cyan:#0E94BE; --vert:#22A45D; --vertf:#178048; --fond:#F1F7FA; --texte:#14304A; --gris:#5C6F82; --trait:#DCE7F0; --ombre:0 6px 18px rgba(11,79,134,.10);
    --titre:'Baloo 2', 'Nunito', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; --corps:'Nunito', -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }

  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:var(--corps); background:var(--fond); color:var(--texte); font-size:16.5px; line-height:1.4; font-weight:500; min-height:100vh; }

  /* ---------- En-tête ---------- */

  .rebours.fini { color:#fff; background:var(--vert); }

  main { padding:16px 14px; max-width:620px; margin:0 auto; }
  /* ---------- Éléments communs ---------- */

  details.regl[open] summary::after { content:'–'; }
  details.regl > div { padding:0 18px 16px; }
  /* ---------- Carnet de l'équipe ---------- */
  .eqCarte { display:flex; gap:14px; align-items:center; }
  .avatar { flex:0 0 78px; height:78px; border-radius:50%; background:var(--trait) center/cover; border:4px solid #fff; box-shadow:0 0 0 3px var(--orange); display:flex; align-items:center; justify-content:center; font-family:var(--titre); font-weight:800; font-size:28px; color:#fff; }

  .heroEp.logo { background-size:80%; background-repeat:no-repeat; background-color:#fff; }
  .heroEp::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg,rgba(7,43,76,0) 45%,rgba(7,43,76,.85)); }

  .fait { text-align:center; border-radius:20px; padding:20px 16px; background:#FCE9E9; color:var(--rouge); margin-bottom:6px; }
  .fait .gros { font-family:var(--titre); font-size:28px; font-weight:800; }
  .defi { display:flex; gap:12px; align-items:center; background:#fff; border-radius:18px; padding:12px; margin-bottom:10px; box-shadow:var(--ombre); }

  td .detail { font-size:11.5px; color:var(--gris); font-weight:700; margin-top:2px; line-height:1.3; }

  /* ---------- Charte Proxim'Services ---------- */
  .ep { border-top:4px solid var(--c,var(--bleu)); }

function sha256(ascii){
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  var mp=Math.pow, maxWord=mp(2,32), result='', words=[], bitLen=ascii.length*8, i, j;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], pc=k.length, comp={};
  for(var c=2; pc<64; c++){ if(!comp[c]){ for(i=0;i<313;i+=c) comp[i]=c; hash[pc]=(mp(c,.5)*maxWord)|0; k[pc++]=(mp(c,1/3)*maxWord)|0; } }
  ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); if(j>>8) return ''; words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bitLen/maxWord)|0); words[words.length]=(bitLen);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), old=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+old[i])|0;
  }
  for(i=0;i<8;i++){ for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); } }
  return result;
}

function confettis(fort){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='confettis'; document.body.appendChild(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1), W=cv.width=innerWidth*dpr, H=cv.height=innerHeight*dpr, ctx=cv.getContext('2d');
  const cols=['#F7941D','#E3222B','#0085B2','#FDCC1A','#22A45D','#ffffff','#EF5A24'];
  const ps=Array.from({length:fort?240:130},(_,i)=>({ x:W*(fort?Math.random():.5+(Math.random()-.5)*.4), y:fort?-20*dpr-Math.random()*H*.5:H*.38, vx:(Math.random()-.5)*(fort?4:16)*dpr, vy:fort?(2+Math.random()*3)*dpr:-(6+Math.random()*10)*dpr,
    r:(5+Math.random()*6)*dpr, c:cols[i%cols.length], a:Math.random()*6, va:(Math.random()-.5)*.35, f:Math.random()<.5 }));
  const t0=performance.now(), duree=fort?4500:2800;
  (function anim(t){ ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy+=.28*dpr; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; if(p.f){ ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); } else { ctx.beginPath(); ctx.arc(0,0,p.r/3,0,6.3); ctx.fill(); } ctx.restore(); });
    if(t-t0<duree) requestAnimationFrame(anim); else cv.remove(); })(t0);
}

async function appel(url, opts, delai){            // requête avec délai maximum : un réseau faible ne bloque jamais l'écran
  const ctl = ('AbortController' in window) ? new AbortController() : null; const tm = setTimeout(()=>{ try{ ctl && ctl.abort(); }catch(e){} }, delai||12000);
  try{ return await fetch(url, {...opts, signal: ctl?ctl.signal:undefined}); }
  catch(e){ const err=new Error('Pas de réseau'); err.statut=0; throw err; }
  finally{ clearTimeout(tm); }
}
async function dbGet(table, filtre){
  const r = await appel(`${SUPABASE_URL}/rest/v1/${table}?event=eq.${EVENT}&${filtre}`, {headers:H});
  if(!r.ok){ const err=new Error(await r.text()); err.statut=r.status; throw err; }
  return r.json();
}
async function dbUpsert(table, conflict, row){
  let corps={...row}; if(SANS_COEUR) delete corps.b_coeur;
  for(let i=0;i<3;i++){
    const r = await appel(`${SUPABASE_URL}/rest/v1/${table}?on_conflict=${conflict}`, {method:'POST', headers:{...H,'Prefer':'resolution=merge-duplicates,return=minimal'}, body:JSON.stringify(corps)}, corps.photo?25000:12000);
    if(r.ok) return;
    const txt = await r.text();
    if('b_coeur' in corps && /b_coeur/.test(txt)){ SANS_COEUR=true; delete corps.b_coeur; continue; }
    if(r.status===413 && corps.photo){ delete corps.photo; continue; }     // photo trop lourde : on garde l'inscription sans la photo
    const err=new Error(txt); err.statut=r.status; throw err;
  }
}
let enFlush=false, reFlush=false;
async function flush(){
  if(enFlush){ reFlush=true; return; } enFlush=true; reFlush=false; let ok=0; const tentes=new Set();
  for(const k of Object.keys(queue)){ tentes.add(k);
    const q=queue[k];
    try{ await dbUpsert(q.table, q.conflict, q.row); if(queue[k]===q) delete queue[k]; state.dbOk=true; ok++; }
    catch(e){
      if(e.statut>=400 && e.statut<500 && e.statut!==408 && e.statut!==429){ q.ko=(q.ko||0)+1; q.msg=String(e.message||'').slice(0,160); continue; }   // refus de la base : on n'empêche pas les autres envois
      state.dbOk=false; state.err=String(e.message||e); break;
    }
  }
  enFlush=false; save(); majEnvoi(); renderDoux();
  if(state.dbOk!==false && (reFlush || Object.keys(queue).some(k=>!tentes.has(k)))) setTimeout(flush, 50);   // un envoi arrivé pendant le précédent part tout de suite
}

function passages(){

  rows.forEach(r=>{ const e=eq[r.team]; if(!e) return; const p=pts[kp(r.stand,r.team)]; if(p==null) return;
    const b=ptsBonus(r);

  dfs.forEach(r=>{ const e=eq[r.team]; if(!e) return; e.defisBrut+=ptsDefi(r); if(r.envoye) e.nbDefis++; });
  Object.values(eq).forEach(e=>{ e.base=r1(e.base); e.bonus=Math.min(BONUS_MAX, e.bonusBrut); e.photos=r1(Math.min(DEFIS_MAX, e.defisBrut/DEFIS_DIVISEUR));
    e.chat = state.chatEq && state.chatEq.has(e.t) ? CHAT_PTS : 0; e.total=r1(e.base+e.bonus+e.photos+e.chat); e.subsid = state.subsid && state.subsid[e.t]!=null ? state.subsid[e.t] : null; });   // arrondi au dixième

  const general = eq[ordre[0]].total>0 ? ordre[0] : null;
  const ecart = e => (state.reponseSubsid!=null && e.subsid!=null) ? Math.abs(e.subsid-state.reponseSubsid) : Infinity;
  const qz = Object.values(eq).filter(e=>e.quiz!=null && e.t!==general).sort((a,b)=> b.quizBrut-a.quizBrut || ecart(a)-ecart(b) || b.total-a.total || a.t-b.t);   // bonnes réponses, puis rapidité, puis subsidiaire

function photoAvecBandeau(source, legende, nom){ return new Promise((ok,ko)=>{
  const url = typeof source==='string' ? source : URL.createObjectURL(source); const im=new Image();
  im.onload=()=>{ const max=1600, k=Math.min(1,max/Math.max(im.width,im.height)); const w=Math.round(im.width*k), h=Math.round(im.height*k); const bh=Math.max(46,Math.round(Math.max(w,h)*0.055));
    const cv=document.createElement('canvas'); cv.width=w; cv.height=h+bh; const c=cv.getContext('2d'); c.drawImage(im,0,0,w,h);
    c.fillStyle='#0D6897'; c.fillRect(0,h,w,bh); ['#F26B12','#EC0512','#0784B0','#F9CB19'].forEach((col,i)=>{ c.fillStyle=col; c.fillRect(i*w/4,h,w/4+1,Math.max(4,bh*0.09)); }); c.fillStyle='#fff'; c.font=`bold ${Math.round(bh*0.42)}px Arial, sans-serif`; c.textBaseline='middle'; c.fillText(legende, Math.round(bh*0.3), h+bh*0.55, w-bh*0.6);
    if(typeof source!=='string') URL.revokeObjectURL(url);
    cv.toBlob(b=>{ if(!b) return ko(); ok({ fichier:new File([b], nom, {type:'image/jpeg'}), apercu:cv.toDataURL('image/jpeg',0.45) }); }, 'image/jpeg', 0.85); };
  im.onerror=()=>ko(); im.src=url; }); }

function photoReduite(source){ return new Promise((ok,ko)=>{ const url = typeof source==='string' ? source : URL.createObjectURL(source); const im=new Image();
  im.onload=()=>{ const max=1000, k=Math.min(1,max/Math.max(im.width,im.height)); const cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k);
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height); if(typeof source!=='string') URL.revokeObjectURL(url); ok(cv.toDataURL('image/jpeg',0.62)); };
  im.onerror=()=>ko(); im.src=url; }); }

function avecLegende(photo, haut, slogan){ return new Promise(ok=>{ const im=new Image();      // bandeau AJOUTÉ sous la photo : rien ne cache les visages
  im.onload=()=>{ const w=im.width, h=im.height, cv=document.createElement('canvas'), c=cv.getContext('2d'), F=n=>`bold ${n}px Arial, sans-serif`;
    let lignes=[], fs=0, pt=0, b;
    if(slogan){ fs=Math.round(w*0.052); pt=Math.round(fs*0.42); c.font=F(fs);
      const coupe=()=>{ const out=[]; let l=''; ('« '+slogan+' »').split(' ').forEach(m=>{ const e=l?l+' '+m:m; if(c.measureText(e).width>w*0.9 && l){ out.push(l); l=m; } else l=e; }); out.push(l); return out; };
      lignes=coupe(); if(lignes.length>2){ fs=Math.round(fs*0.8); c.font=F(fs); lignes=coupe().slice(0,3); }
      b=Math.round(fs*0.7 + lignes.length*fs*1.18 + pt*2.2); }
    else b=Math.round(Math.max(54, w*0.075));
    cv.width=w; cv.height=h+b; c.drawImage(im,0,0); c.fillStyle='#0D6897'; c.fillRect(0,h,w,b);
    ['#F26B12','#EC0512','#0784B0','#F9CB19'].forEach((col,i)=>{ c.fillStyle=col; c.fillRect(i*w/4,h,w/4+1,Math.max(4,Math.round(w*0.006))); });
    c.textBaseline='middle'; c.fillStyle='#fff';
    if(slogan){ c.textAlign='center'; c.font=F(fs); let y=h+fs*0.45+fs*0.59;
      lignes.forEach(x=>{ c.fillText(x, w/2, y, w*0.94); y+=fs*1.18; });
      c.font=`${pt}px Arial, sans-serif`; c.fillStyle='#CFE4F3'; c.fillText(haut, w/2, h+b-pt*1.1, w*0.9); }
    else { c.textAlign='left'; c.font=F(Math.round(b*0.42)); c.fillText(haut, Math.round(b*0.3), h+b*0.56, w-b*0.6); }
    ok(cv.toDataURL('image/jpeg',0.66)); };
  im.onerror=()=>ok(photo); im.src=photo; }); }

async function regleHorloge(){ try{ const t0=Date.now(); const r=await appel(location.pathname+'?h='+t0, {method:'HEAD', cache:'no-store'}, 6000); const d=Date.parse(r.headers.get('date')||''); if(!d) return;
  const off=d+500-(t0+Date.now())/2; const nv=Math.abs(off)>120000 ? Math.round(off) : 0; if(nv!==DECAL){ DECAL=nv; try{ localStorage.setItem('pxc_decal',String(nv)); }catch(e){} majRebours(); } }catch(e){} }
regleHorloge(); setInterval(regleHorloge, 10*60000);

else if(!confirmee() && !(tQ>=1)) state.team=0;
(()=>{ const k=Q.get('k'); if(!k) return;                 // QR code de Romain : un jeton secret ouvre l'organisation sans taper le code
  if(EMPREINTES.lien && empreinte('lien',k)===EMPREINTES.lien){ state.org=true; try{ localStorage.setItem('pxc_org','1'); }catch(e){} if(!confirmee()) state.team=0; state.view='org'; }
  try{ const u=new URL(location.href); u.searchParams.delete('k'); history.replaceState(null,'',u.pathname+u.search); }catch(e){} })();
